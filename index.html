// ----- 평가 창 -----
function openFoodRate(pid){
  const p = S.places.find(x => x.id === pid);
  const r = fRatingsOf(pid).find(x => x.member_id === S.me) || {};
  const val = { overall:r.overall != null ? +r.overall : null };
  FD_SCORES.forEach(([k]) => { val[k] = r[k] != null ? +r[k] : null; });
  let revisit = r.revisit ?? null;
  const row = (k, size) => [1, 2, 3, 4, 5].map(i => `<span class="pstar st ${size} ${val[k] >= i ? 'on' : val[k] >= i - .5 ? 'half' : ''}">★<button class="hl" data-k="${k}" data-v="${i - .5}"></button><button class="hr" data-k="${k}" data-v="${i}"></button></span>`).join('');
  openModal(`<h3>${esc(p.name)}</h3><p class="sub" style="margin:0">별 왼쪽 = 반 개, 오른쪽 = 한 개</p>
    <div class="fd-ov"><span>총점</span><div class="picker" id="pk-overall">${row('overall', '')}</div><b id="v-overall"></b></div>
    <div class="fd-sub">${FD_SCORES.map(([k, l]) => `<div class="fd-srow"><span>${l}</span><div class="picker sm" id="pk-${k}">${row(k, 'sm')}</div><b id="v-${k}"></b><button class="icon clr" data-clr="${k}" title="지우기">✕</button></div>`).join('')}</div>
    <div class="flabel" style="margin-top:12px">재방문 의사</div>
    <div class="fd-rvsel">${FD_REVISIT.map(([v, e, l]) => `<button type="button" data-rv="${v}" class="${revisit === v ? 'on' : ''}">${e} ${l}</button>`).join('')}</div>
    <div class="form">
      <label class="full">추천 메뉴<input id="frm" value="${esc(r.best_menu || '')}" placeholder="예) 생갈비, 된장찌개"></label>
      <label class="full">한줄평<textarea id="frc" rows="2" placeholder="한줄평">${esc(r.comment || '')}</textarea></label>
    </div>
    <p class="err" id="merr"></p>
    <div class="row">${r.id ? '<button class="btn danger" id="del">평가 삭제</button>' : ''}<span class="sp"></span>
      <button class="btn" id="cancel">취소</button><button class="btn primary" id="save">저장</button></div>`);
  const redraw = k => { $('#pk-' + k).innerHTML = row(k, k === 'overall' ? '' : 'sm'); $('#v-' + k).textContent = val[k] != null ? val[k].toFixed(1) : (k === 'overall' ? '필수' : '–'); };
  ['overall', ...FD_SCORES.map(x => x[0])].forEach(redraw);
  $('.sheet').onclick = e => {
    const b = e.target.closest('button[data-v]'); if (b){ val[b.dataset.k] = +b.dataset.v; redraw(b.dataset.k); return; }
    const c = e.target.closest('[data-clr]'); if (c){ val[c.dataset.clr] = null; redraw(c.dataset.clr); return; }
    const rv = e.target.closest('[data-rv]'); if (rv){ revisit = revisit === +rv.dataset.rv ? null : +rv.dataset.rv; document.querySelectorAll('[data-rv]').forEach(x => x.classList.toggle('on', +x.dataset.rv === revisit)); }
  };
  $('#cancel').onclick = closeModal;
  $('#save').onclick = async () => {
    if (val.overall == null){ $('#merr').textContent = '총점 별점을 골라주세요.'; return; }
    try { await call('fd_save_rating', { p_place_id:pid, p_d:{ ...val, revisit, best_menu:$('#frm').value, comment:$('#frc').value } }); await loadFood(); closeModal(); render(); toast('평가를 저장했어요'); }
    catch(e){ $('#merr').textContent = errMsg(e); }
  };
  if (r.id) $('#del').onclick = async () => { if (!confirm('내 평가를 삭제할까요?')) return; try { await call('fd_delete_rating', { p_place_id:pid }); await loadFood(); closeModal(); render(); } catch(e){ $('#merr').textContent = errMsg(e); } };
}

          ${w.note ? `<div class="wish-note">${esc(w.note)}</div>` : ''}
          <div class="wish-bar"><span style="width:${vs.length / max * 100}%"></span></div>
          <div class="wish-by">${vs.length ? vs.map(v => esc(memName(v.member_id))).join(', ') : '아직 투표 없음'} · ${esc(memName(w.created_by))}님이 올림</div>
        </div>

// ================= 🎮 방구석 게이머 =================
const GM_PLATFORMS = ['Steam·PC', 'PS5', '스위치', 'Xbox', '모바일', '보드게임', '기타'];
const GM_PICON = { 'Steam·PC':'💻', PS5:'🎮', 스위치:'🕹', Xbox:'🟩', 모바일:'📱', 보드게임:'🎲', 기타:'👾' };
const GM_STATUS = { playing:['🔥', '하는 중'], wish:['🕹', '하고 싶음'], cleared:['🏁', '클리어'], dropped:['💤', '접음'] };
const GM_SCORES = [['fun', '재미'], ['coop', '협동'], ['addict', '중독성'], ['value', '가성비']];
const GM_AGAIN = [[2, '😍', '또 하자'], [1, '🙂', '가끔'], [0, '🙅', '그만']];

async function loadGame(){
  const res = await Promise.all([
    sb.from('gm_games').select('*'), sb.from('gm_votes').select('*'),
    sb.from('gm_reviews').select('*'), sb.from('gm_sessions').select('*'),
  ]);
  const bad = res.find(x => x.error);
  if (bad){ S.gameErr = bad.error.message; [S.games, S.gVotes, S.gReviews, S.gSessions] = [[], [], [], []]; return; }
  S.gameErr = null;
  [S.games, S.gVotes, S.gReviews, S.gSessions] = res.map(x => x.data);
}
const gameGuard = () => S.gameErr
  ? `<div class="panel ac-locked">🎮<br>게이머 기능을 쓰려면 Supabase에서 <b>11_game.sql</b>을 먼저 실행해주세요<br><small>${esc(S.gameErr)}</small></div>` : '';
const gVotes = id => (S.gVotes || []).filter(v => v.game_id === id);
const gReviewsOf = id => (S.gReviews || []).filter(r => r.game_id === id);
const gSessionsOf = id => (S.gSessions || []).filter(s => s.game_id === id);
const gameOf = id => (S.games || []).find(g => g.id === id);
const hm = m => !m ? '0분' : m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}`;
function gameStats(g){
  const rs = gReviewsOf(g.id), avg = k => { const v = rs.map(r => r[k]).filter(x => x != null).map(Number); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const scores = {}; GM_SCORES.forEach(([k]) => scores[k] = avg(k));
  const again = [0, 0, 0]; rs.forEach(r => { if (r.again != null) again[r.again]++; });
  const ss = gSessionsOf(g.id).filter(s => s.play_date <= todayStr());
  return { rs, n:rs.length, overall:avg('overall'), scores, again, plays:ss.length, minutes:ss.reduce((a, s) => a + (s.minutes || 0), 0) };
}
const gCover = (g, cls = '') => g.cover_url
  ? `<div class="gm-cover ${cls}"><img src="${esc(g.cover_url)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='${GM_PICON[g.platform] || '👾'}'"></div>`
  : `<div class="gm-cover ${cls}">${GM_PICON[g.platform] || '👾'}</div>`;
function gameHero(){
  const past = (S.gSessions || []).filter(s => s.play_date <= todayStr());
  const mins = past.reduce((a, s) => a + (s.minutes || 0), 0);
  return `<div class="gm-hero">
      <div><div class="ac-kicker" style="color:#a99bff">CORNER OF THE ROOM</div>
        <div class="ac-title">방구석 게이머</div>
        <p>넷이서 같이 할 게임 고르고, 하고 나면 깐깐하게 매기기</p></div>
      <div class="tv-stats"><div><b>${(S.games || []).length}</b><small>게임</small></div><div><b>${past.length}</b><small>같이 한 날</small></div><div><b>${Math.round(mins / 60)}</b><small>총 시간</small></div></div>
    </div>`;
}

function renderGReviews(){
  if (S.gameErr) return $('#main').innerHTML = gameGuard();
  S.gSort ??= 'score';
  const rated = S.games.map(g => ({ g, st:gameStats(g) })).filter(x => x.st.n);
  const sorters = {
    score:(a, b) => b.st.overall - a.st.overall || b.st.n - a.st.n,
    again:(a, b) => (b.st.again[2] / b.st.n) - (a.st.again[2] / a.st.n) || b.st.overall - a.st.overall,
    time:(a, b) => b.st.minutes - a.st.minutes || b.st.overall - a.st.overall,

const fmtMin = m => m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}`;

async function loadRandom(tid){
  const pub = await Promise.all([
    sb.from('rt_cities').select('*').order('id'), sb.from('rt_spins').select('*').eq('trip_id', tid),
    sb.from('rt_card_types').select('*').order('sort'), sb.from('rt_cards').select('*').eq('trip_id', tid),
    sb.from('rt_gates').select('*').eq('trip_id', tid), sb.from('rt_gate_votes').select('*'),
    sb.from('rt_penalties').select('*').order('sort'), sb.from('rt_state').select('*').eq('trip_id', tid),
    sb.rpc('rt_card_counts', { p_trip:tid }), sb.rpc('rt_pool_stats', { p_trip:tid }),
  ]);
  const bad = pub.find(x => x.error);
  if (bad){ S.rt = { err:bad.error.message }; return; }
  const [cities, spins, types, used, gates, gateVotes, penalties, state, counts, poolStats] = pub.map(x => x.data);
  const priv = await Promise.all([call('rt_my_cards', { p_trip:tid }), call('rt_my_pool', { p_trip:tid }), call('rt_culprit_state', { p_trip:tid }).catch(() => [])]);
  const ex = await Promise.all([sb.from('rt_meal_cats').select('*').order('sort'), sb.from('rt_meals').select('*').eq('trip_id', tid)]);
  const exBad = ex.find(x => x.error);
  const [mealCats, meals] = exBad ? [[], []] : ex.map(x => x.data);
  const cl = await sb.from('rt_card_log').select('*').eq('trip_id', tid);
  const sl = await sb.from('rt_sleeps').select('*').eq('trip_id', tid);
  const ft = await sb.from('rt_fates').select('*').eq('trip_id', tid);
  const cardLog = cl.error ? [] : cl.data;
  const gids = new Set(gates.map(g => g.id));
  S.rt = { tid, cities, spins, types, used, gates, gateVotes:gateVotes.filter(v => gids.has(v.gate_id)), penalties, counts, poolStats,
    state:state[0] || { gate_trigger:'move', gate_every:120, gate_from:10, gate_to:20, gate_limit:30, gate_fail:'penalty', gate_verify:'either' },
    myCards:priv[0] || [], myPool:priv[1] || [], culprit:priv[2] || [],
    mealCats, meals, cardLog, sleeps:sl.error ? [] : sl.data, fates:ft.error ? [] : ft.data, exErr:exBad?.error.message || null };
}

}

async function resizeImage(file, max = 1600){
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
}

async function gateUpload(file){
  const g = openGate(); if (!g || !file) return;

    const blob = await resizeImage(file);
    const path = `gates/${g.trip_id}/${g.id}-${Date.now()}.jpg`;
    const up = await sb.storage.from('cor-photos').upload(path, blob, { contentType:'image/jpeg', upsert:false });
    if (up.error) throw up.error;
    const url = sb.storage.from('cor-photos').getPublicUrl(path).data.publicUrl;
    const r = await call('rt_gate_photo', { p_gate:g.id, p_url:url });
    await loadRandom(g.trip_id); renderTrips();
    toast(r === 'cleared' ? '🎉 관문 클리어! 출발하세요' : '📸 인증샷을 올렸어요');
  } catch(e){ alert('사진을 올리지 못했어요: ' + errMsg(e)); }
}

// 1초마다 타이머, 30초마다 새 소식 확인 (랜덤 탭을 보고 있을 때만)
let _gateBusy = false, _gateTickAt = 0;
setInterval(async () => {
  const dv = document.querySelector('.gate-timer[data-drive]');
  if (dv) dv.textContent = fmtMin(Math.round((new Date() - new Date(dv.dataset.drive)) / 60000));
  const el = document.querySelector('.gate-timer[data-deadline]');
  if (el){
    const left = new Date(el.dataset.deadline) - new Date();
    if (left > 0) el.textContent = mmss(left);
    else if (!_gateBusy && S.rt?.state?.gate_fail === 'penalty'){
      _gateBusy = true; el.textContent = '⏱ 판정 중…';
      try { const r = await call('rt_expire_gate', { p_gate:+el.dataset.gid }); await loadRandom(S.rt.tid); renderTrips(); if (r === 'failed') toast('💥 시간 초과! 벌칙 당첨자를 확인하세요'); } catch(e){}
      _gateBusy = false;
    } else if (S.rt?.state?.gate_fail === 'block') el.textContent = '⛔ 시간 초과!';
  }
  if (S.cat === 'travel' && S.tripTab === 'random' && S.rt?.tid === S.tripId && !S.rt.err && Date.now() - _gateTickAt > 30000 && !_gateBusy){
    _gateTickAt = Date.now();
    const sig = () => JSON.stringify([S.rt.gates, S.rt.gateVotes, S.rt.spins, S.rt.used, S.rt.culprit, S.rt.meals, S.rt.sleeps, S.rt.fates, S.rt.state, S.rt.counts, S.rt.cardLog]);
    const myBefore = (S.rt.myCards || []).filter(c => !c.used_at).length;
    const before = sig();
    try {
      if (['time', 'both'].includes(S.rt.state.gate_trigger)) await call('rt_tick_gate', { p_trip:S.rt.tid });
      await loadRandom(S.rt.tid);
      const typing = document.activeElement?.matches('input,textarea,select') || $('#modal')?.classList.contains('open');
      if (!typing && before !== sig()){
        const g = openGate(); renderTrips(); if (g && !before.includes(`"id":${g.id},`)) toast(`🔓 새 관문 미션이 열렸어요!`);
        const myAfter = (S.rt.myCards || []).filter(c => !c.used_at).length;
        if (myAfter > myBefore) toast(`🎁 찬스 카드 ${myAfter - myBefore}장을 받았어요!`); else if (myAfter < myBefore) toast(`🏴‍☠️ 내 찬스 카드를 뺏겼어요!`);
      }
    } catch(e){}
  }
}, 1000);

const SLEEP_TYPES = ['⛺ 야외취침', '🎒 게스트하우스', '🏡 민박', '🏩 모텔', '🏨 호텔', '🏠 에어비앤비', '🌲 펜션', '🏯 한옥스테이', '♨️ 찜질방'];

const plainName = x => x.replace(/^[^\p{L}\p{N}]+/u, '').trim();
function rtSleep(t){
  const R = S.rt, types = R.state.sleep_types || SLEEP_TYPES, budgets = R.state.sleep_budgets || SLEEP_BUDGETS;

  const hist = [...(R.sleeps || [])].sort((a, b) => b.id - a.id);
  return `<div class="panel meal-panel">
      <div class="rt-band"><span class="fd-fl">언제</span>${labels.map(l => `<button class="chip sm ${S.rtSleepLabel === l ? 'on' : ''}" data-act="rtSleepLabel" data-k="${esc(l)}">${esc(l)}</button>`).join('')}</div>
      <div class="rt-band"><span class="fd-fl">숙소</span>${types.map(x => `<button class="chip sm ${S.rtSleepT.includes(x) ? 'on' : ''}" data-act="rtSleepT" data-k="${esc(x)}">${esc(x)}</button>`).join('')}<button class="link" data-act="rtSleepEditT">✎ 숙소 편집</button></div>

        <small>${new Date(m.created_at).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit' })} · ${esc(shortName(memName(m.created_by)))}님이 돌림</small></div>
      <a class="btn small" href="${naverMap(sleepQuery(t, m.kind))}" target="_blank" rel="noopener">찾기 ↗</a>
      ${isAdmin() ? `<button class="icon" data-act="rtSleepDel" data-id="${m.id}" title="삭제">✕</button>` : ''}</div>`).join('')}</div>` : ''}

}

async function loadQzSeen(){
  S.qzSeen = {};

  const { data, error } = await sb.from('qz_seen').select('deck,qid');
  if (!error){ S.qzServer = true; S.qzSeen = {}; data.forEach(r => qzSeenSet(r.deck).add(r.qid)); qzLocalSave(); }

function qzMark(deck, i){

      case 'rtMealCat': { const c = S.rt.mealCats.find(x => x.id === id); await call('rt_save_meal_cat', { p_id:id, p_emoji:c.emoji, p_name:c.name, p_active:!c.active }); S.rtMealOpen = true; return done(); }
      case 'rtMealCatAdd': await call('rt_save_meal_cat', { p_id:null, p_emoji:$('#mc-e').value, p_name:$('#mc-n').value, p_active:true }); S.rtMealOpen = true; return done();
      case 'rtMealDel': if (!confirm('이 기록을 지울까요?')) return; await call('rt_delete_meal', { p_id:id }); return done();
      case 'rtMealPlace': { const m = S.rt.meals.find(x => x.id === id), city = ([...S.rt.spins].sort((a, b) => b.day - a.day)[0] || {}).city || t.place || '';
        return openPlace(null, { name:'', area:city, category:FD_FROM_MEAL[m.category] || '기타', region:guessRegion(city) }, async () => { await loadFood(); toast('🍽 미식가 맛집에 등록했어요'); }); }
      case 'rtDeck': S.rtDeck = b.dataset.k; return renderTrips();
      case 'rtCarDraw': { const d = CAR_DECKS[S.rtDeck], seen = qzSeenSet(S.rtDeck);
        let pool = d.cards.map((c, i) => i).filter(i => !seen.has(qzId(S.rtDeck, i)));
        if (!pool.length){
          if (!confirm(`${d.name} ${d.cards.length}문제를 전부 풀었어요! 🎉\n처음부터 다시 할까요?`)) return;
          await qzReset(S.rtDeck); pool = d.cards.map((c, i) => i);
        }
        const i = pool[Math.floor(Math.random() * pool.length)];
        qzMark(S.rtDeck, i);
        const mems = tripMembers(t); S.qzHost = ((S.qzHost ?? -1) + 1) % (mems.length || 1);
        S.qz = { deck:S.rtDeck, i, n:S.rtDeck === 'chosung' ? 0 : 1, host:mems[S.qzHost]?.id, locked:[], winner:null, won:0, revealed:false, peek:false };
        return renderTrips(); }
      case 'rtQzResetDeck': { const d = CAR_DECKS[S.rtDeck]; if (!confirm(`${d.name}의 "이미 나온 문제" 기록을 지우고 처음부터 할까요?\n(모든 폰 공통)`)) return; await qzReset(S.rtDeck); S.qz = null; toast('처음부터 다시!'); return renderTrips(); }
      case 'rtCarHint': S.qz.n++; S.qz.peek = false; return renderTrips();
      case 'rtQzPeek': S.qz.peek = !S.qz.peek; return renderTrips();
      case 'rtQzNo': { S.qz.locked.push(id); const left = tripMembers(t).filter(m => m.id !== S.qz.host && !S.qz.locked.includes(m.id));
        if (!left.length){ S.qz.revealed = true; toast('😵 모두 오답! 정답 공개'); } else toast(`❌ ${memName(id)} 오답 · 이 문제는 기회 끝`); return renderTrips(); }
      case 'rtQzOk': { const v = CAR_DECKS[S.qz.deck].cards[S.qz.i], pts = qzPts(S.qz.deck, v, S.qz.deck === 'chosung' ? S.qz.n : Math.max(1, S.qz.n));
        const sc = { ...(S.rtScoreMem ?? carScore(t)) }; sc[id] = (sc[id] || 0) + pts; setCarScore(t, sc);
        S.qz.winner = id; S.qz.won = pts; toast(`🎉 ${memName(id)} 정답! +${pts}점`); return renderTrips(); }
      case 'rtQzGive': S.qz.revealed = true; return renderTrips();
      case 'rtScore': { const sc = { ...(S.rtScoreMem ?? carScore(t)) }; sc[id] = Math.max(0, (sc[id] || 0) + +b.dataset.k); setCarScore(t, sc); return renderTrips(); }
      case 'rtScoreReset': if (!confirm('점수판을 0으로 돌릴까요?')) return; setCarScore(t, {}); return renderTrips();
      case 'rtPenAdd': await call('rt_save_penalty', { p_id:null, p_text:$('#pen-t').value, p_active:true }); S.rtRuleOpen = true; return done();
      case 'rtPenTog': { const p = S.rt.penalties.find(x => x.id === id); await call('rt_save_penalty', { p_id:id, p_text:p.text, p_active:!p.active }); S.rtRuleOpen = true; return done(); }
      case 'rtPenDel': if (!confirm('이 벌칙을 지울까요?')) return; await call('rt_delete_penalty', { p_id:id }); S.rtRuleOpen = true; return done();
    }
  } catch(e){ alert(errMsg(e)); }
}

// ---------- 통계 ----------
function renderStats(){
  const rated = S.ratings.filter(x => x.stars != null);
  const roundOf = mv => S.rounds.find(r => r.id === mv.round_id);

  const mem = S.members.map(m => {
    const v = rated.filter(x => x.member_id === m.id).map(x => +x.stars);
    return { m, n:v.length, avg:mean(v) };
  });
  const memRated = mem.filter(x => x.n);
  const kind = memRated.length ? memRated.reduce((a, b) => b.avg > a.avg ? b : a) : null;
  const harsh = memRated.length ? memRated.reduce((a, b) => b.avg < a.avg ? b : a) : null;

  const rec = S.members.map(m => {
    const ids = new Set(S.movies.filter(mv => mv.kind === 'pick' && roundOf(mv)?.recommender_id === m.id).map(mv => mv.id));
    const v = rated.filter(x => ids.has(x.movie_id) && x.member_id !== m.id).map(x => +x.stars);
    return { m, picks:ids.size, avg:mean(v) };
  });

  const mvs = S.movies.map(mv => {
    const v = rated.filter(x => x.movie_id === mv.id).map(x => +x.stars);
    const a = mean(v);
    const sd = v.length > 1 ? Math.sqrt(v.reduce((s, x) => s + (x - a) ** 2, 0) / v.length) : 0;
    return { mv, r:roundOf(mv), n:v.length, avg:a, sd, lo:Math.min(...v), hi:Math.max(...v) };
  }).filter(x => x.n >= 2);

  S.statOpen ??= {};
  const topAll = [...mvs].sort((a, b) => b.avg - a.avg);
  const lowAll = [...mvs].sort((a, b) => a.avg - b.avg);
  const splitAll = [...mvs].filter(x => x.sd > 0).sort((a, b) => b.sd - a.sd);
  const cut = (arr, k) => S.statOpen[k] ? arr : arr.slice(0, 5);
  const top = cut(topAll, 'top'), low = cut(lowAll, 'low'), split = cut(splitAll, 'split');
  const more = (arr, k) => arr.length > 5
    ? `<button class="btn ghost small statmore" data-act="statMore" data-k="${k}">${S.statOpen[k] ? '접기 ▲' : `전체 보기 (${arr.length}편) ▼`}</button>` : '';
  const rank = (i, label) => `<span class="rk">${i + 1}</span>${label}`;

  const bar = (label, v, meta = '') =>
    `<div class="bar-row"><span class="bl">${label}${meta ? `<small>${meta}</small>` : ''}</span>
     <span class="bt"><span style="width:${v == null ? 0 : v / 5 * 100}%"></span></span>
     <span class="bv">${v == null ? '—' : v.toFixed(2)}</span></div>`;
  const where = x => x.r ? `${String(x.r.year).slice(2)}' ${periodLabel(x.r)}` : '';

  $('#main').innerHTML = `
    <div class="hero">
      <div><small>가장 후한 평론가</small><b>${kind ? esc(kind.m.name) : '—'}</b><span>${kind ? `평균 ${kind.avg.toFixed(2)}점` : ''}</span></div>
      <div><small>가장 짠 평론가</small><b>${harsh ? esc(harsh.m.name) : '—'}</b><span>${harsh ? `평균 ${harsh.avg.toFixed(2)}점` : ''}</span></div>
    </div>
    <div class="cols">
      <div class="panel"><h3>평론가별 평균 별점</h3><p class="d">각자 준 별점의 평균</p>
        ${mem.map(x => bar(esc(x.m.name), x.avg, `${x.n}편`)).join('')}</div>
      <div class="panel"><h3>추천 성적표</h3><p class="d">내 추천작에 다른 멤버들이 준 평균</p>
        ${rec.map(x => bar(esc(x.m.name), x.avg, `${x.picks}편`)).join('')}</div>
      <div class="panel"><h3>역대 최고 평점</h3><p class="d">2명 이상 평가한 영화</p>
        ${top.map((x, i) => bar(rank(i, esc(x.mv.title)), x.avg, where(x))).join('') || '<p class="d">아직 없어요</p>'}${more(topAll, 'top')}</div>
      <div class="panel"><h3>역대 최저 평점</h3><p class="d">2명 이상 평가한 영화</p>
        ${low.map((x, i) => bar(rank(i, esc(x.mv.title)), x.avg, where(x))).join('') || '<p class="d">아직 없어요</p>'}${more(lowAll, 'low')}</div>
    </div>
    <div class="panel"><h3>의견이 가장 갈린 영화</h3><p class="d">별점 편차가 큰 순서</p>
      ${split.map((x, i) => bar(rank(i, esc(x.mv.title)), x.avg, `최저 ${x.lo} · 최고 ${x.hi}`)).join('') || '<p class="d">아직 없어요</p>'}${more(splitAll, 'split')}</div>`;
}

function openModal(html){

// 내 평가
function openRate(mid, who){
  if (who !== S.me && !isAdmin()) who = S.me;
  const m = S.movies.find(x => x.id === mid);
  const mine = ratingsOf(mid).find(x => x.member_id === who);
  let val = mine?.stars != null ? Number(mine.stars) : null;
  const whoSel = isAdmin()
    ? `<div class="form" style="margin:8px 0 4px"><label class="full">누구의 평가<select id="who">${S.members.map(mb => `<option value="${mb.id}" ${mb.id === who ? 'selected' : ''}>${esc(mb.name)}${mb.id === S.me ? ' (나)' : ''}</option>`).join('')}</select></label></div>`
    : '';
  openModal(`<h3>${esc(m.title)}</h3>${whoSel}<p class="sub" style="margin:0">별 왼쪽을 누르면 반 개, 오른쪽을 누르면 한 개</p>
    <div class="picker" id="pk"></div><div class="pv" id="pv"></div>
    <textarea id="cm" rows="3" maxlength="300" placeholder="한줄평">${esc(mine?.comment ?? '')}</textarea>
    <p class="err" id="merr"></p>
    <div class="row">${mine ? '<button class="btn danger" id="del">삭제</button>' : ''}<span class="sp"></span>
      <button class="btn" id="cancel">취소</button><button class="btn primary" id="save">저장</button></div>`);
  const draw = () => {
    $('#pk').innerHTML = [1,2,3,4,5].map(i =>
      `<span class="pstar st ${val >= i ? 'on' : val >= i - .5 ? 'half' : ''}">★<button class="hl" data-v="${i - .5}" aria-label="${i - .5}점"></button><button class="hr" data-v="${i}" aria-label="${i}점"></button></span>`).join('');
    $('#pv').innerHTML = val != null ? `<strong>${val}점</strong> · <button class="link" id="clr">별점 지우기</button>` : '별점 없음';
  };
  draw();
  if ($('#who')) $('#who').onchange = () => openRate(mid, +$('#who').value);
  $('#pk').onclick = e => { const b = e.target.closest('button[data-v]'); if (b){ val = +b.dataset.v; draw(); } };
  $('#pv').onclick = e => { if (e.target.id === 'clr'){ val = null; draw(); } };
  $('#cancel').onclick = closeModal;
  const save = async (stars, comment) => {
    try { await call('mv_save_rating', { p_movie_id:mid, p_stars:stars, p_comment:comment, p_member_id:who }); await afterSave(); }
    catch(e){ if ($('#merr')) $('#merr').textContent = errMsg(e); }
  };
  $('#save').onclick = () => save(val, $('#cm').value);
  if (mine) $('#del').onclick = () => { if (confirm(`${who === S.me ? '내' : memName(who) + '님의'} 평가를 삭제할까요?`)) save(null, ''); };
}

// 회차 추가/수정
function openRound(id){
  const r = id ? S.rounds.find(x => x.id === id) : null;
  const yr = r?.year ?? S.year;
  const pt = r?.period_type ?? (S.kind === 'month' ? 'month' : 'quarter');
  let per = r?.period;
  if (!r){
    const same = S.rounds.filter(x => x.year === yr && x.period_type === pt).map(x => x.period);
    per = Math.min(Math.max(0, ...same) + 1, pt === 'month' ? 12 : 4);
  }
  openModal(`<h3>${r ? '회차 수정' : '새 회차'}</h3>
    <div class="form">
      <label>연도<input id="fy" type="number" value="${yr}"></label>
      <label>방식<select id="ft"><option value="quarter" ${pt === 'quarter' ? 'selected' : ''}>분기</option><option value="month" ${pt === 'month' ? 'selected' : ''}>월</option></select></label>
      <label>기간 (몇 분기 / 몇 월)<input id="fp" type="number" min="1" max="12" value="${per}"></label>
      <label>추천자<select id="fr"><option value="">없음</option>${S.members.map(m => `<option value="${m.id}" ${r?.recommender_id === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
      <div class="full"><div class="flabel">누구를 위해 추천? <small class="dim">· 여러 명 선택 가능</small></div>
        <div class="fd-rvsel" id="ffor"><button type="button" data-all="1">모두</button>${S.members.map(m => `<button type="button" data-mid="${m.id}" class="${(r?.recommended_for || []).includes(m.id) ? 'on' : ''}">${esc(m.name)}</button>`).join('')}</div></div>
      <label class="full">테마명<input id="fth" value="${esc(r?.theme ?? '')}" placeholder="예) 애니메이션 특별전"></label>
      <label class="full">추천 이유<input id="frs" value="${esc(r?.reason ?? '')}"></label>
    </div>
    <p class="err" id="merr"></p>
    <div class="row">${r ? '<button class="btn danger" id="del">회차 삭제</button>' : ''}<span class="sp"></span>
      <button class="btn" id="cancel">취소</button><button class="btn primary" id="save">저장</button></div>`);
  const forSel = new Set(r?.recommended_for || []);
  const forDraw = () => { document.querySelectorAll('#ffor [data-mid]').forEach(b => b.classList.toggle('on', forSel.has(+b.dataset.mid)));
    $('#ffor [data-all]').classList.toggle('on', S.members.every(m => forSel.has(m.id))); };
  $('#ffor').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.all){ const all = S.members.every(m => forSel.has(m.id)); S.members.forEach(m => all ? forSel.delete(m.id) : forSel.add(m.id)); }
    else { const id = +b.dataset.mid; forSel.has(id) ? forSel.delete(id) : forSel.add(id); }
    forDraw(); };

  $('#cancel').onclick = closeModal;

      await call('mv_save_round', {
        p_id:r?.id ?? null, p_year:year, p_period_type:$('#ft').value, p_period:+$('#fp').value,

      S.year = year; await afterSave();
    } catch(e){ $('#merr').textContent = errMsg(e); }
  };
  if (r) $('#del').onclick = async () => {
    if (!confirm('이 회차의 영화와 평가가 모두 지워져요. 삭제할까요?')) return;
    try { await call('mv_delete_round', { p_id:r.id }); await afterSave(); } catch(e){ $('#merr').textContent = errMsg(e); }
  };
}

        <div class="pchk">${PLATFORMS.map(([n]) => `<label><input type="checkbox" value="${esc(n)}" ${(m?.platforms || []).includes(n) ? 'checked' : ''}>${esc(n)}</label>`).join('')}</div></div>
      <label id="sdL">관람 날짜<input id="fsd" type="date" value="${m?.event_date || ''}"></label>
      <label id="schL">장소 · 메모<input id="fsc" value="${esc(schedPlace(m))}" placeholder="예) 대전 명보시네마"></label>
    </div>
    <p class="err" id="merr"></p>
    <div class="row">${m ? '<button class="btn danger" id="del">영화 삭제</button>' : ''}<span class="sp"></span>
      <button class="btn" id="cancel">취소</button><button class="btn primary" id="save">저장</button></div>`);
  const toggle = () => {
    const g = $('#fk').value === 'group';
    $('#slotL').style.display = g ? 'none' : '';
    $('#schL').style.display = g ? '' : 'none';
    $('#sdL').style.display = g ? '' : 'none';
  };
  toggle(); $('#fk').onchange = toggle;
  $('#cancel').onclick = closeModal;
  if (m && useTMDB()){
    const search = async () => {
      $('#tmres').innerHTML = '<small class="note">검색 중…</small>';
      try {
        const res = (await tmdb('/search/movie', { query:$('#tmq').value })).results || [];
        $('#tmres').innerHTML = res.slice(0, 8).map(x => `<button type="button" class="tm-opt" data-tid="${x.id}">
          ${x.poster_path ? `<img src="${TMDB_IMG}w92${x.poster_path}" alt="">` : '<span class="ph">🎬</span>'}
          <span><b>${esc(x.title)}</b><br><small>${esc([(x.release_date || '').slice(0, 4), x.original_title !== x.title ? x.original_title : ''].filter(Boolean).join(' · '))}</small></span></button>`).join('')
          || '<small class="note">검색 결과가 없어요</small>';
      } catch(e){ $('#tmres').innerHTML = `<small class="err">${esc(e.message)}</small>`; }
    };
    $('#tmfind').onclick = () => { $('#tmsearch').style.display = ''; search(); };
    $('#tmgo').onclick = search;
    $('#tmq').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); search(); } };
    $('#tmres').onclick = async e => {
      const b = e.target.closest('[data-tid]'); if (!b) return;
      $('#tmres').innerHTML = '<small class="note">저장 중…</small>';
      try { await saveTmdb(m, +b.dataset.tid, await tmdbDetails(+b.dataset.tid)); closeModal(); }
      catch(err){ $('#merr').textContent = errMsg(err); }
    };
    $('#tmnone').onclick = async () => { try { await saveTmdb(m, 0, null); closeModal(); } catch(err){ $('#merr').textContent = errMsg(err); } };
  }
  $('#save').onclick = async () => {
    const g = $('#fk').value === 'group';
    try {
      await call('mv_save_movie', {
        p_id:m?.id ?? null, p_round_id:rid, p_kind:$('#fk').value,
        p_slot:g ? 9 : +$('#fs').value, p_title:$('#fti').value, p_schedule:g ? $('#fsc').value : '',
        p_platforms:[...document.querySelectorAll('.pchk input:checked')].map(x => x.value), p_event_date:g && $('#fsd').value ? $('#fsd').value : null });
      await afterSave();
    } catch(e){ $('#merr').textContent = errMsg(e); }
  };
  if (m) $('#del').onclick = async () => {
    if (!confirm(`'${m.title}'과 평가가 모두 지워져요. 삭제할까요?`)) return;
    try { await call('mv_delete_movie', { p_id:m.id }); await afterSave(); } catch(e){ $('#merr').textContent = errMsg(e); }
  };
}

// 비밀번호 변경
function openPassword(){
  openModal(`<h3>비밀번호 변경</h3>
    <div class="form">
      <label class="full">현재 비밀번호<input id="po" type="password" autocomplete="current-password"></label>
      <label class="full">새 비밀번호 (4자 이상)<input id="pn" type="password" autocomplete="new-password"></label>
      <label class="full">새 비밀번호 확인<input id="pn2" type="password" autocomplete="new-password"></label>
    </div>
    <p class="err" id="merr"></p>
    <div class="row"><button class="btn" id="pout">로그아웃</button><span class="sp"></span><button class="btn" id="cancel">취소</button><button class="btn primary" id="save">변경</button></div>`);
  $('#pout').onclick = () => logout();
  $('#cancel').onclick = closeModal;
  $('#save').onclick = async () => {
    if ($('#pn').value !== $('#pn2').value){ $('#merr').textContent = '새 비밀번호가 서로 달라요.'; return; }
    try {
      const ok = await call('mv_change_password', { p_old:$('#po').value, p_new:$('#pn').value });
      if (!ok){ $('#merr').textContent = '현재 비밀번호가 맞지 않아요.'; return; }
      closeModal(); alert('비밀번호를 바꿨어요.');
    } catch(e){ $('#merr').textContent = errMsg(e); }
  };
}

// ---------- 앱(PWA) ----------
// ---------- 새로고침 (버튼 · 당겨서 새로고침 · 다시 열 때 자동) ----------
let _refreshing = false;
async function refreshAll(silent){
  if (_refreshing || !S.token) return;
  _refreshing = true; document.body.classList.add('refreshing');
  try {
    const y = scrollY;
    await loadAll();
    if (!$('#modal').classList.contains('open') && !document.querySelector('.cer')){ render(); scrollTo(0, y); }
    navigator.serviceWorker?.getRegistration().then(r => r?.update()).catch(() => {});
    if (!silent) toast('최신 내용으로 새로고침했어요');
  } catch(e){ if (!silent) toast('새로고침 실패 · 인터넷 연결을 확인해 주세요'); }
  finally { _refreshing = false; document.body.classList.remove('refreshing'); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.token && Date.now() - (S.lastLoad || 0) > 60000) refreshAll(true);
});
(() => {   // 홈 화면 앱(PWA)에서 위에서 아래로 당기면 새로고침
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone) return;
  const ind = document.createElement('div'); ind.className = 'ptr'; ind.innerHTML = '<span>↻</span>'; document.body.appendChild(ind);
  let y0 = null, dy = 0;
  const blocked = () => $('#modal')?.classList.contains('open') || document.querySelector('.cer') || !S.token;
  addEventListener('touchstart', e => { y0 = scrollY <= 0 && !blocked() && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (scrollY > 0){ y0 = null; dy = 0; }
    const d = Math.min(dy * 0.5, 90);
    ind.style.transform = `translate(-50%, ${d - 50}px) rotate(${d * 4}deg)`; ind.style.opacity = Math.min(1, d / 50);
    ind.classList.toggle('ready', d >= 60);
  }, { passive:true });
  addEventListener('touchend', () => {
    if (y0 != null && dy * 0.5 >= 60){ ind.classList.add('spin'); refreshAll().finally(() => { ind.classList.remove('spin', 'ready'); ind.style.opacity = 0; ind.style.transform = ''; }); }
    else { ind.style.opacity = 0; ind.style.transform = ''; ind.classList.remove('ready'); }
    y0 = null; dy = 0;
  }, { passive:true });
})();

if ('serviceWorker' in navigator){
  // 새 버전이 올라오면 앱이 알아서 받아서 한 번 새로고침
  let reloaded = false;
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded){ reloaded = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' })
    .then(r => { r.update(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update(); }); })
    .catch(() => {}));
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; S.canInstall = true; if (S.me) render(); });
window.addEventListener('appinstalled', () => { S.canInstall = false; installEvt = null; if (S.me) render(); });
document.addEventListener('click', async e => {
  if (e.target.closest('#instbtn') && installEvt){ installEvt.prompt(); await installEvt.userChoice; installEvt = null; S.canInstall = false; if (S.me) render(); }
});
(() => {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let dismissed = false; try { dismissed = localStorage.getItem('mvclub_ioshint') === '1'; } catch(e){}
  if (!ios || standalone || dismissed) return;
  const bar = document.createElement('div');
  bar.className = 'ioshint';
  bar.innerHTML = `<div><b>앱처럼 쓰기</b><br>아래 <span class="share">공유 <svg width="13" height="15" viewBox="0 0 13 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5V1M3.5 4l3-3 3 3M2 7v6.5h9V7"/></svg></span> 버튼 → <b>홈 화면에 추가</b>를 누르세요</div><button aria-label="닫기">✕</button>`;
  bar.querySelector('button').onclick = () => { bar.remove(); try { localStorage.setItem('mvclub_ioshint', '1'); } catch(e){} };
  document.body.appendChild(bar);
})();

init().catch(e => { $('#app').innerHTML = `<div class="loading">오류: ${esc(errMsg(e))}</div>`; });
</script>
