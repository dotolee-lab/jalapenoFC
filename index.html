<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할라피뇨 랜덤 팀짜기</title>
<style>
  :root{--bg:#f5f7f6;--card:#fff;--text:#1d2420;--muted:#6b756f;--line:#e2e7e4;--accent:#1f8a5b;--accent2:#e8f5ee;--danger:#c0392b;
        --fw:#d9534f;--fw2:#fbe9e8;--mf:#2f7fd1;--mf2:#e6f0fb;--df:#c98a12;--df2:#fbf2df}
  @media (prefers-color-scheme: dark){:root{--bg:#121614;--card:#1b211e;--text:#e8eeea;--muted:#9aa5a0;--line:#2c3430;--accent:#3dbb82;--accent2:#1f2e27;--danger:#e57366;
        --fw:#f08a85;--fw2:#3a2423;--mf:#7fb3ec;--mf2:#1f2d3d;--df:#e3b45a;--df2:#352c1a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
  main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:4px 0 16px}
  h2{font-size:16px;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=text],select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
  input[type=text]{flex:1;min-width:120px}
  button{padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
  button.ghost{background:var(--accent2);color:var(--accent)}
  button.del{background:none;color:var(--danger);padding:4px 8px}
  label.chk{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:500}
  td select{padding:4px 6px;font-size:14px}
  .muted{color:var(--muted);font-size:13px}
  .teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .team{border:1px solid var(--line);border-radius:10px;padding:12px}
  .team h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between}
  .team .pos{font-size:12px;color:var(--muted);margin-bottom:6px}
  .team ul{margin:0;padding-left:18px;font-size:14px}
  .badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--accent2);color:var(--accent);margin-left:4px}
  .b-공격{background:var(--fw2);color:var(--fw)}
  .b-미드{background:var(--mf2);color:var(--mf)}
  .b-수비{background:var(--df2);color:var(--df)}
  .summary{margin-top:10px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>⚽ 풋살 팀 밸런서</h1>

  <section class="card">
    <h2>선수 등록</h2>
    <div class="row">
      <input type="text" id="name" placeholder="이름">
      <select id="grade">
        <option value="5">S</option><option value="4">A</option><option value="3" selected>B</option><option value="2">C</option><option value="1">D</option>
      </select>
      <select id="pos">
        <option value="공격">공격</option><option value="미드" selected>미드</option><option value="수비">수비</option>
      </select>
      <select id="act">
        <option value="좋음">활동량 좋음</option><option value="보통" selected>활동량 보통</option><option value="나쁨">활동량 나쁨</option>
      </select>
      <label class="chk"><input type="checkbox" id="gk"> 키퍼 가능</label>
      <button id="add">추가</button>
    </div>
    <p class="muted">등급 점수: S=5 · A=4 · B=3 · C=2 · D=1 &nbsp;|&nbsp; 활동량 가산점: 좋음 +1 · 보통 +0.5 · 나쁨 0 &nbsp;→ 총점 = 등급 + 활동량</p>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">선수 명단 <span class="muted" id="count"></span></h2>
      <div class="row">
        <button class="ghost" id="allOn">전체 참석</button>
        <button class="ghost" id="allOff">전체 해제</button>
      </div>
    </div>
    <div class="tablewrap">
    <table>
      <thead><tr><th>참석</th><th>이름</th><th>등급</th><th>활동량</th><th>총점</th><th>포지션</th><th>키퍼</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    </div>
  </section>

  <section class="card">
    <h2>팀 나누기</h2>
    <div class="row">
      <select id="teamCount"><option value="2">2팀</option><option value="3" selected>3팀</option></select>
      <select id="teamSize"><option value="6" selected>팀당 6명</option><option value="7">팀당 7명</option></select>
      <button id="make">팀 구성하기</button>
      <button class="ghost" id="again">다시 섞기</button>
    </div>
    <p class="muted">총점(등급+활동량)을 가장 먼저 맞추고, 그다음 포지션과 키퍼 가능 인원이 팀마다 고르게 섞이도록 나눠요.</p>
    <p class="muted" id="need"></p>
    <div id="result" style="margin-top:14px"></div>
  </section>

  <section class="card">
    <h2>백업</h2>
    <div class="row">
      <button class="ghost" id="exp">명단 내보내기</button>
      <button class="ghost" id="imp">명단 불러오기</button>
    </div>
    <p class="muted">명단은 이 브라우저에 저장돼요. 다른 기기로 옮길 때는 내보내기로 복사한 텍스트를 불러오기에 붙여넣으세요.</p>
  </section>
</main>

<script>
const GRADES = {5:'S',4:'A',3:'B',2:'C',1:'D'};
const POSITIONS = ['공격','미드','수비'];
const ACTS = {'좋음':1, '보통':0.5, '나쁨':0};
const score = p => p.grade + (ACTS[p.act] ?? 0.5);
const fmt = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
const KEY = 'futsal-players-v1';
let players = normalize(load());

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(players)); }catch(e){} }
// 예전 명단(포지션·활동량 없음)은 '미드'·'보통'으로 채워서 그대로 사용
function normalize(list){ return list.map(p=>({...p, pos: POSITIONS.includes(p.pos) ? p.pos : '미드', act: (p.act in ACTS) ? p.act : '보통'})); }
const $ = id => document.getElementById(id);

function render(){
  const tb = $('list'); tb.innerHTML = '';
  players.sort((a,b)=>score(b)-score(a) || a.name.localeCompare(b.name,'ko'));
  players.forEach(p=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="checkbox" ${p.on?'checked':''} data-k="on"></td>
      <td>${esc(p.name)}</td>
      <td><select data-k="grade">${[5,4,3,2,1].map(g=>`<option value="${g}" ${g==p.grade?'selected':''}>${GRADES[g]}</option>`).join('')}</select></td>
      <td><select data-k="act">${Object.keys(ACTS).map(x=>`<option ${x===p.act?'selected':''}>${x}</option>`).join('')}</select></td>
      <td><b>${fmt(score(p))}</b></td>
      <td><select data-k="pos">${POSITIONS.map(x=>`<option ${x===p.pos?'selected':''}>${x}</option>`).join('')}</select></td>
      <td><input type="checkbox" ${p.gk?'checked':''} data-k="gk"></td>
      <td><button class="del">삭제</button></td>`;
    tr.querySelector('[data-k=on]').onchange = e=>{p.on=e.target.checked;save();count();};
    tr.querySelector('[data-k=gk]').onchange = e=>{p.gk=e.target.checked;save();};
    tr.querySelector('[data-k=pos]').onchange = e=>{p.pos=e.target.value;save();};
    tr.querySelector('[data-k=act]').onchange = e=>{p.act=e.target.value;save();render();};
    tr.querySelector('[data-k=grade]').onchange = e=>{p.grade=+e.target.value;save();render();};
    tr.querySelector('.del').onclick = ()=>{ if(confirm(p.name+' 삭제할까요?')){players=players.filter(x=>x!==p);save();render();} };
    tb.appendChild(tr);
  });
  count();
}
function count(){
  const on = players.filter(p=>p.on);
  const byPos = POSITIONS.map(x=>`${x} ${on.filter(p=>p.pos===x).length}`).join(' · ');
  $('count').textContent = `(전체 ${players.length}명 · 참석 ${on.length}명 — ${byPos})`;
  if(typeof updateNeed === 'function') updateNeed();
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('add').onclick = ()=>{
  const name = $('name').value.trim(); if(!name) return;
  if(players.some(p=>p.name===name)){ alert('이미 있는 이름이에요'); return; }
  players.push({name, grade:+$('grade').value, act:$('act').value, pos:$('pos').value, gk:$('gk').checked, on:true});
  $('name').value=''; $('gk').checked=false; save(); render(); $('name').focus();
};
$('name').addEventListener('keydown',e=>{ if(e.key==='Enter') $('add').click(); });
$('allOn').onclick = ()=>{ players.forEach(p=>p.on=true); save(); render(); };
$('allOff').onclick = ()=>{ players.forEach(p=>p.on=false); save(); render(); };

/* ---------- 팀 밸런싱 ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const sum = t => t.reduce((s,p)=>s+score(p),0);
const spread = teams => { const s=teams.map(sum); return Math.max(...s)-Math.min(...s); };
function variance(arr){ const m=arr.reduce((a,b)=>a+b,0)/arr.length; return arr.reduce((a,b)=>a+(b-m)**2,0); }

// 비용: 총점 차이(가장 중요) + 포지션 쏠림 + 키퍼 가능 인원 쏠림 + 인원수 차이
function cost(teams){
  const score = variance(teams.map(sum)) * 10;
  const pos = POSITIONS.reduce((s,x)=>s + variance(teams.map(t=>t.filter(p=>p.pos===x).length)), 0) * 3;
  const gk = variance(teams.map(t=>t.filter(p=>p.gk).length)) * 4;
  const size = variance(teams.map(t=>t.length)) * 100;
  return score + pos + gk + size;
}

function snake(list, n){
  const teams = Array.from({length:n},()=>[]);
  const sorted = shuffle(list.slice()).sort((a,b)=>score(b)-score(a)); // 같은 총점끼리는 무작위
  sorted.forEach((p,i)=>{
    const round = Math.floor(i/n), k = i%n;
    teams[round%2===0 ? k : n-1-k].push(p);
  });
  return teams;
}

function improve(teams){
  const n = teams.length;
  let best = cost(teams), improved = true, guard = 0;
  while(improved && guard++ < 300){
    improved = false;
    const pairs = [];
    for(let a=0;a<n;a++) for(let b=a+1;b<n;b++) pairs.push([a,b]);
    for(const [a,b] of shuffle(pairs))
      for(const i of shuffle([...teams[a].keys()])) for(const j of shuffle([...teams[b].keys()])){
        const x=teams[a][i], y=teams[b][j];
        teams[a][i]=y; teams[b][j]=x;
        const c = cost(teams);
        if(c < best - 1e-9){ best = c; improved = true; }
        else { teams[a][i]=x; teams[b][j]=y; }
      }
  }
  return {teams, c: best};
}

function balance(list, n){
  // 여러 번 시도해서 가장 균형 잡힌 결과 중 하나를 고름 (매번 조금씩 다른 조합)
  const results = [];
  for(let r=0;r<40;r++) results.push(improve(snake(list,n)));
  const min = Math.min(...results.map(x=>x.c));
  const good = results.filter(x=>x.c <= min + 1e-9);
  return good[Math.floor(Math.random()*good.length)].teams;
}

// 필요 인원 안내: 팀 수 × 팀당 인원과 오늘 참석 인원 비교
function needInfo(){
  const n = +$('teamCount').value, size = +$('teamSize').value;
  const need = n*size, have = players.filter(p=>p.on).length;
  if(have === need) return {text:`필요 ${need}명 · 참석 ${have}명 — 딱 맞아요 ✅`, ok:true};
  if(have > need){
    const extra = have-need, lo = Math.floor(have/n), hi = Math.ceil(have/n);
    return {text:`필요 ${need}명 · 참석 ${have}명 — ${extra}명이 남아서 교체 인원으로 나눠 넣어 팀당 ${lo===hi?lo:lo+'~'+hi}명이 돼요.`, ok:true};
  }
  const short = need-have, lo = Math.floor(have/n), hi = Math.ceil(have/n);
  return {text:`필요 ${need}명 · 참석 ${have}명 — ${short}명이 부족해서 팀당 ${lo===hi?lo:lo+'~'+hi}명으로 구성돼요.`, ok:have>=n*2};
}
function updateNeed(){ $('need').textContent = needInfo().text; }
['teamCount','teamSize'].forEach(id=>$(id).addEventListener('change',()=>{
  try{ localStorage.setItem('futsal-setting-v1', JSON.stringify({n:$('teamCount').value, size:$('teamSize').value})); }catch(e){}
  updateNeed();
}));
try{ const s = JSON.parse(localStorage.getItem('futsal-setting-v1')); if(s){ $('teamCount').value=s.n; $('teamSize').value=s.size; } }catch(e){}

function make(){
  const n = +$('teamCount').value;
  const on = players.filter(p=>p.on);
  if(on.length < n*2){ $('result').innerHTML = `<p class="muted">참석 인원이 너무 적어요. (${on.length}명)</p>`; return; }
  const teams = balance(on, n);
  const names = ['A팀','B팀','C팀'];
  const order = {공격:0, 미드:1, 수비:2};
  $('result').innerHTML = `<div class="teams">${teams.map((t,i)=>{
    const posLine = POSITIONS.map(x=>`${x} ${t.filter(p=>p.pos===x).length}`).join(' · ') + ` · 키퍼가능 ${t.filter(p=>p.gk).length}`;
    const members = t.slice().sort((a,b)=>order[a.pos]-order[b.pos] || score(b)-score(a));
    return `<div class="team"><h3><span>${names[i]} (${t.length}명)</span><span>${fmt(sum(t))}점</span></h3>
      <div class="pos">${posLine}</div>
      <ul>${members.map(p=>`<li>${esc(p.name)} <span class="badge b-${p.pos}">${p.pos}</span><span class="badge">${GRADES[p.grade]}</span><span class="badge">활동 ${p.act}</span>${p.gk?'<span class="badge">GK</span>':''}</li>`).join('')}</ul></div>`;
  }).join('')}
  </div><p class="summary">팀 점수 차이: 최대 <b>${fmt(spread(teams))}점</b> · 평균 ${(teams.map(sum).reduce((a,b)=>a+b,0)/n).toFixed(1)}점</p>`;
}
$('make').onclick = make;
$('again').onclick = make;

/* ---------- 백업 ---------- */
$('exp').onclick = ()=>{
  const txt = JSON.stringify(players);
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert('명단을 복사했어요. 메모장 등에 붙여넣어 보관하세요.'), ()=>prompt('아래 내용을 복사하세요', txt));
  else prompt('아래 내용을 복사하세요', txt);
};
$('imp').onclick = ()=>{
  const txt = prompt('내보낸 명단 텍스트를 붙여넣으세요'); if(!txt) return;
  try{ const d = JSON.parse(txt); if(!Array.isArray(d)) throw 0; players = normalize(d); save(); render(); alert('불러왔어요'); }
  catch(e){ alert('형식이 올바르지 않아요'); }
};

render();
</script>
</body>
</html>
