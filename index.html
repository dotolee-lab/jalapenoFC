<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corner Of The Room</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#13120f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f1ea;--card:#fff;--ink:#1e1b17;--sub:#746d62;--line:#e6e0d4;
  --accent:#b4441b;--accent-ink:#fff;--soft:#f8ece4;
  --star:#e3a21a;--star-off:#dcd6ca;--chip:#ece7dd;
  --group:#2f6b58;--group-soft:#e2efe9;--danger:#b42318;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13120f;--card:#1d1b18;--ink:#eeeae2;--sub:#9d968a;--line:#312d28;
  --accent:#ee7a45;--accent-ink:#1a0f08;--soft:#3a2418;
  --star:#f0b23a;--star-off:#4a453d;--chip:#2a2622;
  --group:#7cc4a8;--group-soft:#1c2e27;--danger:#f97066;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 48px}
.loading,.empty{padding:60px 0;text-align:center;color:var(--sub)}

/* buttons */
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.btn.small{padding:6px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--sub)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--sub);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.icon{background:none;border:0;color:var(--sub);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:8px}
.icon:hover{background:var(--chip)}

/* login */
.login{max-width:380px;margin:0 auto;padding:12vh 16px 40px;text-align:center}
.login .logo{font-size:44px}
.login h1{margin:8px 0 2px;font-size:24px;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:14px;margin:0 0 18px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.who-btn{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:16px}
.who-btn.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
#lf{display:flex;gap:8px}
#lf input{flex:1}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:8px 0 0}

/* header */
.top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{font:inherit;font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand .b-short{display:none}
.brand{display:inline-flex;align-items:center;gap:8px}
.cor-mark{width:22px;height:22px;flex-shrink:0;color:var(--ink)}
.login-mark .cor-mark{width:56px;height:56px}
.login-mark{margin-bottom:6px}
.top-in .sp{flex:1}
.catsw{flex:1;display:flex;gap:4px;min-width:0}
.catsw button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);white-space:nowrap}
.catsw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catsw .cs{display:none}
@media (max-width:700px){.brand .b-full{display:none}.brand .b-short{display:inline}.catsw .cl{display:none}.catsw .cs{display:inline}.me{gap:8px}.me .link{font-size:12px}}
@media (max-width:480px){.catsw .cs{display:none}.catsw button{padding:4px 8px;font-size:15px}.admin-tag{display:none}#out{display:none}.catsw{gap:3px}}
.me{display:flex;gap:12px;align-items:center}
.rfbtn{border:1px solid var(--line);background:var(--card);color:var(--sub);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.rfbtn:hover{color:var(--ink)}
body.refreshing .rfbtn{animation:rfspin .8s linear infinite;color:var(--accent)}
@keyframes rfspin{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:50;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--sub);opacity:0;transform:translate(-50%,-50px);transition:opacity .15s;pointer-events:none}
.ptr.ready{color:var(--accent)}
.ptr.spin{opacity:1!important;transform:translate(-50%,30px)!important;color:var(--accent)}
.ptr.spin span{animation:rfspin .8s linear infinite}
.tabs{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.tabs button{background:none;border:0;padding:8px 12px 10px;cursor:pointer;font-weight:700;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--accent)}

/* records */
.toolbar{display:flex;align-items:center;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chip{border:0;background:var(--chip);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.round{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.r-head{display:flex;align-items:center;gap:8px}
.period{font-weight:800;font-size:13px;color:var(--accent);letter-spacing:.02em}
.badge{font-size:12px;font-weight:700;background:var(--soft);color:var(--accent);padding:2px 10px;border-radius:999px}
.badge.for{background:var(--group-soft);color:var(--group)}
.r-head .icon{margin-left:auto}
.theme{margin:6px 0 2px;font-size:22px;letter-spacing:-.03em;line-height:1.3}
.reason{margin:0 0 14px;color:var(--sub);font-size:14px}
.movies{display:grid;gap:12px;margin-bottom:12px}
@media (min-width:760px){.movies{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}.movies .movie.group{grid-column:1/-1}.movies .movie.group .scores{grid-template-columns:repeat(4,minmax(0,1fr))}}
.months{display:grid;gap:14px;margin-top:16px}
@media (min-width:640px){.months{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:980px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{margin:0;padding:14px 0 0;border-top:0;display:flex;flex-direction:column}
.mcard .reason{line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .reason:empty{display:none}
@media (min-width:640px){.mcard .reason,.mcard .reason:empty{display:-webkit-box;height:2.9em}}
.mcard .movies{flex:1;margin-bottom:8px}
.mcard .movie{height:100%}
.movie{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.movie.group{border-color:color-mix(in srgb,var(--group) 45%,var(--line))}
.m-top{display:flex;gap:12px;align-items:flex-start}
.m-top>div:first-child{flex:1;min-width:0}
.slot{font-size:12px;font-weight:700;color:var(--sub)}
.movie.group .slot{color:var(--group)}
.movie h3{margin:2px 0 0;font-size:18px;letter-spacing:-.02em;line-height:1.3;word-break:keep-all}
.avg{text-align:right;flex-shrink:0}
.avg strong{display:block;font-size:24px;line-height:1;color:var(--accent)}
.avg small{font-size:12px;color:var(--sub)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
@media (min-width:480px){.movie .scores{grid-template-columns:repeat(4,1fr)}}
@media (min-width:760px){.movie .scores{grid-template-columns:1fr 1fr}}
.sc{display:flex;flex-direction:column;font-size:12px;padding:6px 8px;border-radius:10px;background:var(--bg)}
.sc.mine{outline:1.5px solid var(--accent)}
.sc .nm{color:var(--sub);font-weight:600}
.stars{font-size:15px;letter-spacing:1px;white-space:nowrap}
.stars.none{color:var(--sub)}
.st{color:var(--star-off)}
.st.on{color:var(--star)}
.st.half{background:linear-gradient(90deg,var(--star) 50%,var(--star-off) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.coms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.coms li{font-size:14px;line-height:1.45;padding-left:10px;border-left:2px solid var(--line)}
.coms li b{display:block;font-size:11px;color:var(--accent)}
.coms li.anon b{color:var(--sub);font-weight:600}
.coms li .ed{float:right;background:none;border:0;color:var(--sub);cursor:pointer;font-size:12px;padding:0 0 0 8px}
.viewbar{display:flex;align-items:center;gap:10px;margin:14px 0 0}
.viewbar .sp{flex:1}
.sortbtn{flex-shrink:0;white-space:nowrap}
.viewbar+.round{border-top:0;margin-top:10px}
.plats{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.plat{font-size:11px;font-weight:700;padding:2px 8px 2px 6px;border-radius:999px;background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.plat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.jw{font-size:11px;color:var(--sub);text-decoration:none;padding:2px 6px;border-radius:999px;border:1px dashed var(--line);white-space:nowrap}
.jw:hover{color:var(--ink);border-style:solid}
.pchk{display:flex;flex-wrap:wrap;gap:6px}
.pchk label{flex-direction:row!important;align-items:center;gap:5px!important;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px!important;color:var(--ink)!important;cursor:pointer}
.pchk input{width:auto;margin:0}
.seg{flex:1;display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg small{font-weight:600;color:var(--sub);margin-left:2px}
.sec{margin:34px 0 0;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--sub);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec+.round{border-top:0;margin-top:8px}
.admin-tag{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:999px;margin-left:4px;text-decoration:none}
.note{font-size:12px;color:var(--sub);margin:6px 0 0}
.pickbox{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 20px;text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pickbox.rolling .pick-title{opacity:.55;filter:blur(.5px)}
.pick-empty{color:var(--sub);font-size:15px;line-height:2}
.pick-empty{font-size:15px}
.pick-meta{font-size:13px;font-weight:700;color:var(--accent)}
.pick-title{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin:6px 0 4px;word-break:keep-all}
.pick-sub{color:var(--sub);font-size:14px}
.pick-score{margin:10px 0 2px;font-size:14px}
.pick-score .stars{font-size:18px}
.bigbtn{font-size:16px;padding:12px 28px}
.pick-in{display:flex;gap:24px;align-items:center;width:100%;max-width:760px;text-align:left}
.pick-body{flex:1;min-width:0}
.poster{width:170px;flex-shrink:0;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--chip)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster.none{display:none}
.pick-in .pick-title{font-size:26px}
.overview{font-size:14px;line-height:1.6;color:var(--sub);margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.provs{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.provrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.provrow small{font-size:11px;color:var(--sub);font-weight:700;margin-right:2px}
.prov{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px}
.prov img{width:20px;height:20px;border-radius:5px}
.chip-sep{width:1px;background:var(--line);margin:0 4px;align-self:stretch}
.credit{font-size:11px;color:var(--sub);text-align:center;margin-top:24px;line-height:1.6}
.credit a{color:var(--sub)}
.ac-hero{position:relative;overflow:hidden;margin-top:16px;padding:26px 22px 20px;border-radius:22px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,#d4a017 30%,transparent),transparent 60%),linear-gradient(160deg,#211b10,#15130f);border:1px solid color-mix(in srgb,#d4a017 40%,var(--line));color:#f4efe2}
.ac-hero::after{content:"🏆";position:absolute;right:14px;bottom:-14px;font-size:96px;opacity:.13;transform:rotate(-12deg)}
.ac-kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#d4a017}
.ac-title{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-top:2px}
.ac-title span{color:#d4a017}
.ac-hero p{margin:6px 0 14px;color:#c9c0ad;font-size:14px}
.ac-status{display:flex;flex-wrap:wrap;gap:6px}
.ac-st{font-size:12px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:inline-flex;align-items:center;gap:5px}
.ac-st i{width:7px;height:7px;border-radius:50%;background:#6b655b}
.ac-st.pub i{background:#d4a017}.ac-st.draft i{background:var(--accent)}
.ac-st b{font-weight:600;color:#a9a091}.ac-st.pub b{color:#d4a017}
.ac-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}
.ac-head h3{margin:0;flex:1}
.ac-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--sub)}
.ac-badge.draft{background:var(--soft);color:var(--accent)}
.ac-editor summary{list-style:none;cursor:pointer;display:flex;align-items:center}
.ac-editor summary::-webkit-details-marker{display:none}
.ac-editor summary::after{content:"▾";color:var(--sub);margin-left:8px;transition:transform .2s}
.ac-editor[open] summary::after{transform:rotate(180deg)}
.ac-mybar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.ac-rows{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ac-row{display:grid;grid-template-columns:104px minmax(0,1fr) 28px;gap:6px;align-items:center}
.ac-row input{padding:8px 10px;font-size:15px}
.ac-row .ac-cat{font-weight:700;font-size:14px}
.ac-locked{text-align:center;color:var(--sub);padding:40px 0;line-height:2;font-size:15px}
.ac-reshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 12px}
.ac-reshead h2{margin:0;font-size:20px;letter-spacing:-.02em;flex:1}
.btn.gold{background:#d4a017;border-color:#d4a017;color:#1a1408}
.aw-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.aw-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:980px){.aw-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.aw-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.aw-card.gold{border-color:#d4a017;box-shadow:0 0 0 1px color-mix(in srgb,#d4a017 40%,transparent) inset;background:linear-gradient(180deg,color-mix(in srgb,#d4a017 10%,var(--card)),var(--card) 60%)}
.aw-cat{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--sub);display:flex;align-items:center;gap:6px}
.aw-pick{display:flex;gap:12px;align-items:center;min-height:60px}
.aw-pick.win .aw-txt b{color:#d4a017}
.aw-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.aw-txt b{font-size:16px;line-height:1.35;word-break:keep-all;letter-spacing:-.01em}
.aw-alt{font-size:12px;color:var(--sub);line-height:1.3}
.aw-who{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.aw-who i{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--sub)}
.aw-who em{font-style:normal;font-size:11px;font-weight:800;color:#d4a017}
.pp{width:40px;flex-shrink:0;aspect-ratio:2/3;align-self:flex-start;border-radius:6px;overflow:hidden;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:16px}
.pp img{width:100%;height:100%;object-fit:cover;display:block}
.pp.lg{width:64px;font-size:22px}
.pp.edit{cursor:pointer;position:relative}
.pp.edit:hover::after{content:"✎";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:16px}
.hall-grid{display:grid;gap:14px;margin-top:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.hall-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hall-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:border-color .2s,transform .2s}
.hall-card:hover{border-color:#d4a017;transform:translateY(-2px)}
.hall-top{display:flex;gap:14px;align-items:flex-start}
.hall-posters{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}
.pp.hall{width:84px;height:auto;aspect-ratio:2/3;font-size:28px;border-radius:10px;align-self:flex-start}
.hall-posters:has(.pp.hall + .pp.hall) .pp.hall{width:72px}
.hall-posters:has(.pp.hall + .pp.hall + .pp.hall) .pp.hall{width:60px}
.hall-head{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hall-best small{display:block;font-size:11px;font-weight:700;color:var(--sub)}
.hall-best b{font-size:19px;letter-spacing:-.02em;line-height:1.3;color:#d4a017}
.hall-by{font-size:12px;color:var(--sub);margin-top:auto}
.hall-list{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hall-list li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.4}
.hall-list li span{color:var(--sub);white-space:nowrap}
.hall-list li b{font-weight:600}
.hall-list small{color:var(--sub);font-weight:500}
.cer{position:fixed;inset:0;z-index:40;background:radial-gradient(90% 70% at 50% 0%,#3a2c0c,#0d0b08 70%) fixed;color:#f4efe2;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.cer-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:none;border:0;color:#a9a091;font-size:20px;cursor:pointer}
.cer-in{text-align:center;max-width:560px;width:100%;animation:cerIn .5s ease;margin:auto 0;padding:20px 0}
.cer-in.wide{max-width:980px}
.cer-title.sm{font-size:28px}
.cer-skip{background:none;border:0;color:#a9a091;font:inherit;font-size:13px;text-decoration:underline;margin-top:14px;cursor:pointer}
.cer-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;text-align:left;margin:22px 0 6px}

.pstar{position:relative;font-size:44px;line-height:1;user-select:none}
.pstar button{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0;cursor:pointer}
.pstar .hl{left:0}.pstar .hr{right:0}
.pv{text-align:center;font-size:14px;color:var(--sub);min-height:22px;margin-bottom:12px}
.pv strong{color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
textarea{resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--sub)}

.form > *{min-width:0}
.form label > input:not([type=checkbox]):not([type=radio]),.form label > select{width:100%;min-width:0;box-sizing:border-box;height:46px}

.form input[type=date]::-webkit-date-and-time-value{text-align:left}
.row{display:flex;gap:8px;align-items:center;margin-top:14px}
.row .sp{flex:1}

<script>
// ===== 설정 =====
const SITE_TITLE   = 'Corner Of The Room';
const COR_MARK = '<svg class="cor-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12 V34 M32 34 L13 45 M32 34 L51 45" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" fill="none"/><circle cx="32" cy="34" r="4.6" fill="#ee7a45"/></svg>';
const SUPABASE_URL = 'https://gudwubeutvkhjrsardtc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DD4LX04ysEDt7T0ELcdo8Q_Cl1hSPPE';
const TMDB_KEY     = '645b1fc12706b3545394daf79af67c7d';   // ← TMDB API 키(32자리)를 따옴표 안에 붙여넣기. 비워두면 기본 명작 목록 사용
// =================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = { members:[], rounds:[], movies:[], ratings:[], legacy:[], ballots:[], awards:[], me:null, token:null, year:null, kind:'quarter', tab:'records', order:(()=>{try{return localStorage.getItem('mvclub_order')||'desc'}catch(e){return 'desc'}})() };
const PLATFORMS = [
  ['넷플릭스','#e50914'], ['티빙','#ff153c'], ['쿠팡플레이','#00a8e8'], ['웨이브','#1f6bff'],
  ['왓챠','#ff0558'], ['디즈니+','#1a3fd1'], ['애플TV+','#8e8e93'], ['극장','#f2b33d'],
];
const platColor = n => PLATFORMS.find(p => p[0] === n)?.[1] ?? '#888';
const searchTitle = t => t.replace(/\s*\(\d{4}\)\s*$/, '').replace(/\(.*?\)/g, '').trim();
const LS = 'mvclub_session';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const memName = id => S.members.find(m => m.id === id)?.name ?? '?';
const isAdmin = () => !!S.members.find(m => m.id === S.me)?.is_admin;
const periodLabel = r => r.period_type === 'month' ? `${r.period}월` : `${r.period}분기`;
const ratingsOf = mid => S.ratings.filter(x => x.movie_id === mid);
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const starVals = list => list.map(x => x.stars).filter(v => v != null).map(Number);

function stars(v){
  if (v == null) return '<span class="stars none">—</span>';
  v = Number(v); let h = '';
  for (let i = 1; i <= 5; i++) h += `<span class="st ${v >= i ? 'on' : v >= i - .5 ? 'half' : ''}">★</span>`;
  return `<span class="stars" title="${v}점">${h}</span>`;
}

function saveSess(){ try{ localStorage.setItem(LS, JSON.stringify({ token:S.token })) }catch(e){} }
function loadSess(){ try{ return JSON.parse(localStorage.getItem(LS) || 'null') }catch(e){ return null } }
function clearSess(){ try{ localStorage.removeItem(LS) }catch(e){} }

async function call(fn, args){
  const { data, error } = await sb.rpc(fn, { p_token:S.token, ...args });
  if (error){
    if (/로그인이 필요/.test(error.message)){ alert('다시 로그인해주세요.'); logout(true); }
    throw error;
  }
  return data;
}
function errMsg(e){
  const m = e?.message || String(e);
  if (/duplicate key|unique/i.test(m)) return '같은 기간의 회차가 이미 있어요.';
  return m;
}

// ---------- 시작 ----------
async function init(){
  const { data, error } = await sb.from('mv_members').select('*').order('sort');
  if (error){ $('#app').innerHTML = `<div class="loading">연결 오류: ${esc(error.message)}</div>`; return; }
  S.members = data;
  const ss = loadSess();
  if (ss?.token){
    const { data:me } = await sb.rpc('mv_whoami', { p_token:ss.token });
    if (me){ S.token = ss.token; S.me = me; } else clearSess();
  }
  if (!S.me) return renderLogin();
  await loadAll(); render(); fillTmdb();
}

async function loadAll(){
  S.lastLoad = Date.now();
  const res = await Promise.all([
    sb.from('mv_rounds').select('*'),
    sb.from('mv_movies').select('*'),
    sb.from('mv_ratings').select('*'),
    sb.from('mv_legacy_comments').select('*').order('sort'),
    sb.from('mv_award_ballots').select('*'),
    sb.from('mv_awards').select('*').order('sort'),
    sb.from('mv_award_posters').select('*'),
  ]);
  const bad = res.find(x => x.error); if (bad) throw bad.error;
  [S.rounds, S.movies, S.ratings, S.legacy, S.ballots, S.awards, S.aposters] = res.map(x => x.data);
  await Promise.all([loadTravel(), loadBest(), loadFood(), loadGame()]);
  const years = yearsList();
  if (!years.includes(S.year)) S.year = years[0] ?? new Date().getFullYear();
}
const yearsList = () => [...new Set(S.rounds.map(x => x.year))].sort((a, b) => b - a);

// ---------- 로그인 ----------
function renderLogin(sel){
  $('#app').innerHTML = `<div class="login">
    <div class="login-mark">${COR_MARK}</div><h1>${esc(SITE_TITLE)}</h1>
    <p class="sub">누구신가요?</p>
    <div class="who">${S.members.map(m => `<button class="who-btn${m.id === sel ? ' on' : ''}" data-id="${m.id}">${esc(m.name)}</button>`).join('')}</div>
    <form id="lf"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" ${sel ? '' : 'disabled'}>
    <button class="btn primary" ${sel ? '' : 'disabled'}>입장</button></form>
    <p class="err" id="lerr"></p></div>`;
  document.querySelectorAll('.who-btn').forEach(b => b.onclick = () => { renderLogin(+b.dataset.id); $('#pw').focus(); });
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const pw = $('#pw').value; if (!pw) return;
    $('#lerr').textContent = '확인 중…';
    const { data, error } = await sb.rpc('mv_login', { p_member_id:sel, p_password:pw });
    if (error || !data){ $('#lerr').textContent = '비밀번호가 맞지 않아요.'; return; }
    resetUserState(); S.token = data; S.me = sel; saveSess();
    try { await loadAll(); render(); fillTmdb(); } catch(err){ $('#lerr').textContent = errMsg(err); }
  };
}

// 계정이 바뀔 때 이전 사람의 화면 기록(작성 중인 아카데미 투표 등)을 모두 비움
function resetUserState(){
  S.adraft = {}; S.bdraft = {}; S.bBallots = []; S.bVotes = []; S.pickResult = null; S.tab = 'records'; S.cat = 'home'; S.lastTab = {}; S.tripId = null; S.tourId = null;
  S.ballots = []; S.awards = []; S.rt = null;
}

async function logout(silent){
  if (!silent && S.token) await sb.rpc('mv_logout', { p_token:S.token });
  clearSess(); resetUserState(); S.token = null; S.me = null; closeModal(); renderLogin();
}

// ---------- 카테고리 ----------

  { k:'travel', icon:'🧳', label:'방구석 여행가', short:'여행가', first:'trips' },
  { k:'food',   icon:'🍽', label:'방구석 미식가', short:'미식가', first:'rank' },
  { k:'game',   icon:'🎮', label:'방구석 게이머', short:'게이머', first:'games' },
];
const TABS = {

    ['records', '기록'], ['stats', '통계'], ['pick', '🎲 랜덤 추천'],
    ['todo', '📝 밀린 평가' + (() => { const n = unratedOf(S.me).length; return n ? ` <span class="tabcount">${n}</span>` : ''; })()],

};
function goCat(k){
  S.lastTab ??= {};
  if (S.cat && S.cat !== 'home') S.lastTab[S.cat] = S.tab;
  S.cat = k;
  if (k !== 'home') S.tab = S.lastTab[k] || CATS.find(c => c.k === k).first;
  if (k === 'travel') S.tripId = null;
  if (k === 'food') S.tourId = null;
  render(); scrollTo({ top:0 });
}

function render(){
  S.cat ??= 'home';
  const home = S.cat === 'home';
  $('#app').innerHTML = `

    <div class="me"><button class="rfbtn" id="rfbtn" title="새로고침" aria-label="새로고침">↻</button><button class="link" id="pwbtn">${esc(memName(S.me))}님${isAdmin() ? '<span class="admin-tag">관리자</span>' : ''}</button>${S.canInstall ? '<button class="link" id="instbtn">📲 앱 설치</button>' : ''}<button class="link" id="out">로그아웃</button></div>
  </div>
  ${home ? '' : `<nav class="tabs">${TABS[S.cat]().map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</nav>`}
  </header>
  <main class="wrap" id="main"></main>`;
  $('#out').onclick = () => logout();

  $('#pwbtn').onclick = openPassword;
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => goCat(b.dataset.nav));

  $('#main').onclick = onMainClick;
  if (home) return renderHome();
  ({ records:renderRecords, stats:renderStats, pick:renderPick, academy:renderAcademy, todo:renderTodo,
     trips:renderTrips, wish:renderWish, pool:renderPool, cal:renderCal, best:renderBest, rank:renderRank, tours:renderTours, fwish:renderFwish,
     games:renderGames, greviews:renderGReviews, gplays:renderGPlays })[S.tab]();
}

// 단체관람 메모에서 관람 날짜와 겹치는 앞부분(10월 18일 …)은 빼고 보여줌
const schedPlace = m => !m ? '' : m.event_date ? (m.schedule || '').replace(/^\s*\d{1,2}\s*(월|\/|\.)\s*\d{1,2}\s*일?\s*/, '').trim() : (m.schedule || '');
// ---------- 다가오는 COR 일정 (홈) ----------
function corEvents(all){
  const today = todayStr(), ev = [];
  (S.trips || []).filter(t => t.start_date).forEach(t => ev.push({ date:t.start_date, end:t.end_date || t.start_date, cat:'travel', icon:'🧳',
    title:t.title, sub:[t.place, fmtRange(t)].filter(Boolean).join(' · '), act:'evTrip', id:t.id }));
  (S.movies || []).filter(m => m.kind === 'group' && m.event_date).forEach(m => {
    const r = S.rounds.find(x => x.id === m.round_id);
    ev.push({ date:m.event_date, cat:'movie', icon:'🎟', title:`단체관람 · ${m.title}`, sub:schedPlace(m) || (r?.theme ?? ''), act:'evMovie', id:m.id });
  });
  (S.tours || []).filter(t => t.tour_date).forEach(t => ev.push({ date:t.tour_date, cat:'food', icon:'🍽', title:t.title, sub:t.area || '맛집 투어', act:'evTour', id:t.id }));
  (S.gSessions || []).filter(x => all ? true : x.play_date > today).forEach(x => { const g = gameOf(x.game_id);
    ev.push({ date:x.play_date, cat:'game', icon:'🎮', title:`게임 날 · ${g ? g.title : '게임 미정'}`, sub:x.memo || ((x.member_ids || []).length === S.members.length ? '4명 모두' : ''), act:'evGame', id:x.id }); });
  const q = quarterNow(), qEnd = ymd(new Date(q.y, q.q * 3, 0));
  ev.push({ date:qEnd, cat:'movie', icon:'⏰', title:`${q.q}분기 마감`, sub:q.round?.theme ? `${q.round.theme} · 밀린 평가 정리` : '분기 테마작 평가 마감', act:'evQuarter' });
  if (q.q === 4) ev.push({ date:`${q.y}-12-31`, cat:'movie', icon:'🏆', title:`${q.y} 방구석 아카데미 · 올해의 작품`, sub:'연말 투표 공개', act:'evAcademy', soft:true });
  return ev.filter(e => all || (e.end || e.date) >= today).sort((a, b) => a.date.localeCompare(b.date) || (a.soft ? 1 : 0) - (b.soft ? 1 : 0));
}
function agendaHTML(){
  const today = todayStr();
  const all = corEvents();
  const list = all.filter((e, i) => i < 3 || dDiff(e.date, today) <= 60).slice(0, 8);
  const qe = all.find(e => e.act === 'evQuarter');
  if (qe && !list.includes(qe)) list.push(qe);
  if (!list.length) return '';
  const wd = d => ['일', '월', '화', '수', '목', '금', '토'][new Date(d + 'T00:00:00').getDay()];
  return `<div class="agenda">
    <div class="ag-head"><h2>📌 다가오는 COR 일정</h2><button class="link" data-act="evCal">달력으로 보기 →</button></div>
    <div class="ag-list">${list.map(e => {
      const left = dDiff(e.date, today), ongoing = e.end && e.date <= today && e.end >= today;
      const badge = ongoing ? '진행 중' : left === 0 ? '오늘' : left === 1 ? '내일' : `D-${left}`;
      return `<button class="ag-row ag-${e.cat}" data-act="${e.act}" data-id="${e.id ?? ''}">
        <div class="ag-date"><b>${+e.date.slice(5, 7)}.${+e.date.slice(8)}</b><small>${wd(e.date)}</small></div>
        <div class="ag-icon">${e.icon}</div>
        <div class="ag-main"><div class="ag-title">${esc(e.title)}</div>${e.sub ? `<div class="ag-sub">${esc(e.sub)}</div>` : ''}</div>
        <span class="ag-d ${left <= 7 || ongoing ? 'hot' : ''}">${badge}</span>
      </button>`; }).join('')}</div>
  </div>`;
}

            <li><span>내 밀린 평가</span><b class="${todo ? 'hot' : ''}">${todo ? todo + '편' : '없음 🎉'}</b></li>
            ${nextGroup ? `<li><span>단체관람</span><b>${esc(nextGroup.title)}</b></li>` : ''}
          </ul>
          <span class="hc-go">들어가기 →</span>
        </button>
        <button class="home-card hc-travel" data-act="goCat" data-k="travel">

            <li><span>다녀온 여행</span><b>${trips.filter(t => tripStatus(t).k === 'done').length}번</b></li>

            <li><span>다음 여행</span><b class="${upcoming ? 'hot' : ''}">${upcoming ? `${esc(upcoming.title)} · ${tripStatus(upcoming).label}` : '아직 없음'}</b></li>
            ${topWish ? `<li><span>가고 싶은 곳 1위</span><b>${esc(topWish.place)}</b></li>` : ''}`}
          </ul>

              return `<li><span>등록된 맛집</span><b>${(S.places || []).length}곳</b></li>

                ${last ? `<li><span>최근 투어</span><b>${esc(last.title)}</b></li>` : ''}

          </ul>

        </button>

          <div class="hc-title">방구석 게이머</div>
          <div class="hc-desc">같이 하고 싶은 게임 투표, 플레이 기록과 후기</div>
          <ul class="hc-facts">
            ${S.gameErr ? '<li><span>준비 중</span><b>11_game.sql 실행 필요</b></li>' : (() => {
              const playing = (S.games || []).filter(g => g.status === 'playing');

              const ym = todayStr().slice(0, 7), month = (S.gSessions || []).filter(x => x.play_date.startsWith(ym) && x.play_date <= todayStr()).length;
              const nx = (S.gSessions || []).filter(x => x.play_date > todayStr()).sort((a, b) => a.play_date.localeCompare(b.play_date))[0];

          </ul>
          <span class="hc-go">들어가기 →</span>
        </button>
      </div>
      ${agendaHTML()}

}

// ----- 분기 선정자 랜덤 뽑기 -----
function drawDefaultYear(){
  const y = new Date().getFullYear();
  const assigned = yy => [1, 2, 3, 4].every(q => S.rounds.find(r => r.year === yy && r.period_type === 'quarter' && r.period === q)?.recommender_id);
  return assigned(y) ? y + 1 : y;
}
function shuffle(a){ a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function drawOrder(y, avoidPrev){
  const ids = S.members.map(m => m.id);
  const pick = () => { const out = []; while (out.length < 4) out.push(...shuffle(ids)); return out.slice(0, 4); };
  const prev = q => S.rounds.find(r => r.year === y - 1 && r.period_type === 'quarter' && r.period === q)?.recommender_id;
  const lastQ4 = prev(4);
  let best = pick();
  if (avoidPrev){
    for (let i = 0; i < 300; i++){
      const o = pick();
      const ok = o.every((id, k) => id !== prev(k + 1)) && o[0] !== lastQ4;
      if (ok){ best = o; break; }
    }
  }
  return best;
}
function openDraw(){
  let y = drawDefaultYear(), result = null, rolling = false;
  const cur = (yy, q) => S.rounds.find(r => r.year === yy && r.period_type === 'quarter' && r.period === q);
  const draw = () => {
    const existing = [1, 2, 3, 4].map(q => cur(y, q)?.recommender_id).filter(Boolean).length;
    const prevLine = [1, 2, 3, 4].map(q => { const r = cur(y - 1, q); return r?.recommender_id ? `${q}분기 ${esc(shortName(memName(r.recommender_id)))}` : null; }).filter(Boolean).join(' · ');
    openModal(`<h3>🎲 분기 테마 선정자 뽑기</h3>
      <div class="form">
        <label>연도<select id="dw-y">${[y - 1, y, y + 1].filter((v, i, a) => a.indexOf(v) === i).sort().map(v => `<option ${v === y ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="dw-opt"><span>옵션</span><span class="dw-chk"><input type="checkbox" id="dw-av" checked> 작년 같은 분기 담당 피하기</span></label>
      </div>
      ${prevLine ? `<p class="note">${y - 1}년: ${prevLine}</p>` : ''}
      <div class="dw-slots">${[1, 2, 3, 4].map((q, k) => { const now = cur(y, q);
        const name = result ? memName(result[k]) : now?.recommender_id ? memName(now.recommender_id) : '?';
        return `<div class="dw-slot ${result ? 'new' : now?.recommender_id ? 'old' : ''}" id="dw-s${k}"><small>${q}분기</small><b>${esc(name)}</b>${now?.theme ? `<em>${esc(now.theme)}</em>` : ''}</div>`; }).join('')}</div>
      ${existing && !result ? `<p class="note">⚠ ${y}년은 이미 ${existing}개 분기에 선정자가 있어요. 확정하면 바뀌어요 (테마명은 그대로 유지).</p>` : ''}
      <p class="err" id="merr"></p>
      <div class="row"><span class="sp"></span>
        <button class="btn" id="cancel">닫기</button>
        <button class="btn ${result ? '' : 'primary'}" id="roll">${result ? '🎲 다시 뽑기' : '🎲 뽑기'}</button>
        ${result ? '<button class="btn primary" id="ok">✅ 이대로 확정</button>' : ''}</div>`);
    $('#cancel').onclick = closeModal;
    $('#dw-y').onchange = () => { y = +$('#dw-y').value; result = null; draw(); };
    $('#roll').onclick = () => {
      if (rolling) return; rolling = true;
      const final = drawOrder(y, $('#dw-av').checked);
      const names = S.members.map(m => m.name);
      const slots = [0, 1, 2, 3].map(k => $('#dw-s' + k));
      slots.forEach(s => { s.classList.remove('old', 'new'); s.classList.add('spin'); });
      let tick = 0;
      const timer = setInterval(() => {
        tick++;
        slots.forEach((s, k) => {
          if (tick < 10 + k * 6) s.querySelector('b').textContent = names[Math.floor(Math.random() * names.length)];
          else if (s.classList.contains('spin')){ s.classList.remove('spin'); s.classList.add('new'); s.querySelector('b').textContent = memName(final[k]); }
        });
        if (tick >= 10 + 3 * 6){ clearInterval(timer); rolling = false; result = final; setTimeout(draw, 350); }
      }, 80);
    };
    if ($('#ok')) $('#ok').onclick = async () => {
      if (!confirm(`${y}년 분기 선정자를\n${result.map((id, k) => `${k + 1}분기 ${memName(id)}`).join(' / ')}\n로 확정할까요? 모두에게 공유돼요.`)) return;
      try {
        for (let q = 1; q <= 4; q++){
          const r = cur(y, q);
          await call('mv_save_round', { p_id:r?.id ?? null, p_year:y, p_period_type:'quarter', p_period:q, p_recommender_id:result[q - 1], p_theme:r?.theme ?? '', p_reason:r?.reason ?? '' });
        }
        await loadAll(); closeModal(); S.year = y; S.kind = 'quarter'; render(); toast(`🎲 ${y}년 선정자를 확정했어요`);
      } catch(e){ $('#merr').textContent = errMsg(e); }
    };
  };
  draw();
}

// ----- 이번 분기 D-Day -----
function quarterNow(){
  const now = new Date(), y = now.getFullYear(), q = Math.floor(now.getMonth() / 3) + 1;
  const start = new Date(y, (q - 1) * 3, 1), end = new Date(y, q * 3, 0);
  const today = new Date(y, now.getMonth(), now.getDate());
  const left = Math.round((end - today) / 86400000);
  const total = Math.round((end - start) / 86400000) + 1, passed = total - left;
  const fmt = d => `${d.getMonth() + 1}.${d.getDate()}`;
  return { y, q, left, total, passed, range:`${fmt(start)} – ${fmt(end)}`, round:S.rounds.find(r => r.year === y && r.period_type === 'quarter' && r.period === q) };
}
function ddayHTML(){
  const n = quarterNow();
  const r = n.round;
  const mv = r ? S.movies.filter(m => m.round_id === r.id) : [];
  const myLeft = mv.filter(m => !ratingsOf(m.id).some(x => x.member_id === S.me && x.stars != null)).length;
  const msg = n.left === 0 ? `오늘이 ${n.q}분기 마지막 날이에요!` : `${n.q}분기 기간이 <b>${n.left}일</b> 남았어요!`;
  const urgent = n.left <= 7;
  return `<div class="dday ${urgent ? 'urgent' : ''}">
    <div class="dd-badge">${n.left === 0 ? 'D-DAY' : 'D-' + n.left}</div>
    <div class="dd-main">
      <div class="dd-msg">${msg}</div>
      <div class="dd-sub">${n.y} · ${n.q}분기 (${n.range})${r?.theme ? ` · ${esc(r.theme)}` : ''}${r?.recommender_id ? ` · ${esc(memName(r.recommender_id))} 추천` : ''}</div>
      <div class="dd-bar"><span style="width:${n.passed / n.total * 100}%"></span></div>
    </div>
    ${r ? (myLeft ? `<button class="btn small ${urgent ? 'primary' : ''}" data-act="ddGo">내 평가 ${myLeft}편 남음 →</button>` : '<span class="dd-ok">✅ 이번 분기 평가 완료</span>') : ''}
  </div>`;
}

function renderRecords(){
  const inYear = S.rounds.filter(r => r.year === S.year);
  const dir = S.order === 'asc' ? 1 : -1;
  const quarters = inYear.filter(r => r.period_type === 'quarter').sort((a, b) => (a.period - b.period) * dir);
  const months = inYear.filter(r => r.period_type === 'month').sort((a, b) => (a.period - b.period) * dir);
  const groups = quarters.flatMap(r => S.movies.filter(m => m.round_id === r.id && m.kind === 'group').map(m => ({ r, m })));
  const views = [
    quarters.length && ['quarter', '분기 테마작', quarters.length],
    groups.length && ['group', '🎟 단체관람', groups.length],
    months.length && ['month', '월별 추천작', months.length],
  ].filter(Boolean);
  if (!views.some(v => v[0] === S.kind)) S.kind = views[0]?.[0] ?? 'quarter';
  const asc = S.order === 'asc';
  const body = S.kind === 'month'
    ? (months.length ? `<div class="months">${months.map(monthHTML).join('')}</div>` : '')
    : S.kind === 'group'
      ? `<div class="tickets">${groups.map(groupHTML).join('')}</div>`
      : quarters.map(roundHTML).join('');
  $('#main').innerHTML = `
    ${ddayHTML()}
    <div class="toolbar">
      <div class="chips">${yearsList().map(y => `<button class="chip ${y === S.year ? 'on' : ''}" data-act="year" data-id="${y}">${y}</button>`).join('')}</div>
      <span class="tb-btns"><button class="btn small" data-act="drawPick">🎲<span class="tl"> 선정자 뽑기</span></button>
      <button class="btn small" data-act="addRound">+<span class="tl"> 회차 추가</span></button></span>
    </div>
    <div class="viewbar">
    ${views.length > 1 ? `<div class="seg">${views.map(([k, l, n]) => `<button class="${S.kind === k ? 'on' : ''}" data-act="kind" data-k="${k}">${l} <small>${n}</small></button>`).join('')}</div>` : '<span class="sp"></span>'}
      <button class="btn small sortbtn" data-act="order">${asc ? (S.kind === 'month' ? '1월부터 ↑' : '1분기부터 ↑') : '최신순 ↓'}</button>
    </div>
    ${body || '<p class="empty">아직 기록이 없어요.</p>'}`;
}

function roundHTML(r){

// ----- TMDB 포스터·정보 -----
function posterHTML(m){
  const t = m.tmdb;
  if (!useTMDB() || m.tmdb_id === 0) return '';
  if (!t) return '<div class="mposter loading"></div>';
  const img = t.poster ? `<img src="${TMDB_IMG}w185${t.poster}" alt="" loading="lazy">` : '<span>🎬</span>';
  return `<a class="mposter" href="https://www.themoviedb.org/movie/${m.tmdb_id}?language=ko" target="_blank" rel="noopener" title="${esc(t.title || '')} 상세 정보">${img}</a>`;
}
function infoLine(m){
  const t = m.tmdb; if (!t) return '';
  const bits = [t.year, t.director, t.runtime ? `${t.runtime}분` : '', (t.genres || []).slice(0, 2).join('·')].filter(Boolean);
  return bits.length ? `<div class="minfo">${bits.map(esc).join(' · ')}</div>` : '';
}
async function tmdbDetails(id){
  const d = await tmdb(`/movie/${id}`, { append_to_response:'credits' });
  const dirP = d.credits?.crew?.find(c => c.job === 'Director');
  let director = dirP?.name || '';
  if (dirP && !/[가-힣]/.test(director)){
    try { const p = await tmdb(`/person/${dirP.id}`); director = (p.also_known_as || []).find(n => /^[가-힣\s·]+$/.test(n)) || director; } catch(e){}
  }
  return { title:d.title, original_title:d.original_title, year:(d.release_date || '').slice(0, 4),
           poster:d.poster_path || null, runtime:d.runtime || null, director,
           genres:(d.genres || []).map(g => g.name), overview:d.overview || '' };
}
async function tmdbBestMatch(m){
  const r = S.rounds.find(x => x.id === m.round_id);
  const yHint = +(String(m.title).match(/\((\d{4})\)/)?.[1] || 0);
  const live = /실사/.test(m.title);                    // '룩백(실사화)' 같은 경우 최신작 우선
  const q = searchTitle(m.title);
  const queries = [...new Set([q, q.replace(/[:·\-!?.,]/g, ' ').replace(/\s+/g, ' ').trim(), q.split(/[:\-]/)[0].trim()])].filter(Boolean);
  let res = [], used = q;
  for (const qq of queries){
    res = (await tmdb('/search/movie', { query:qq, ...(yHint ? { year:String(yHint) } : {}) })).results || [];
    if (res.length){ used = qq; break; }
  }
  if (!res.length) return null;
  const nq = normT(used);
  const exact = res.filter(x => normT(x.title) === nq || normT(x.original_title) === nq);
  let pool = exact.length ? exact : res.slice(0, 1);
  const yr = x => +(x.release_date || '0').slice(0, 4) || 0;
  const limit = (r?.year ?? new Date().getFullYear()) + 1;   // 회차보다 나중에 나온 작품은 제외
  const ok = pool.filter(x => !yr(x) || yr(x) <= limit);
  if (ok.length) pool = ok;
  if (live) return [...pool].sort((a, b) => yr(b) - yr(a))[0];
  return [...pool].sort((a, b) => (b.vote_count || 0) - (a.vote_count || 0))[0];
}
async function saveTmdb(m, tmdbId, info){
  await call('mv_set_tmdb', { p_movie_id:m.id, p_tmdb_id:tmdbId, p_info:info });
  m.tmdb_id = tmdbId; m.tmdb = info;
  const el = document.getElementById('mv-' + m.id);
  if (el) el.outerHTML = movieHTML(m);
}
let tmdbFilling = false;
async function fillTmdb(){
  if (!useTMDB() || tmdbFilling || !S.token) return;
  const todo = S.movies.filter(m => m.tmdb_id == null);
  if (!todo.length) return;
  tmdbFilling = true;
  const worker = async () => {
    while (todo.length && S.token){
      const m = todo.shift();
      try {
        const hit = await tmdbBestMatch(m);
        if (hit) await saveTmdb(m, hit.id, await tmdbDetails(hit.id));
        else await saveTmdb(m, 0, null);
      } catch(e){ /* 다음에 다시 시도 */ }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  tmdbFilling = false;
}

const TMDB_API = 'https://api.themoviedb.org/3';
const TMDB_IMG = 'https://image.tmdb.org/t/p/';
const useTMDB = () => !!TMDB_KEY;
async function tmdb(path, params = {}){
  const u = new URL(TMDB_API + path);
  u.search = new URLSearchParams({ api_key:TMDB_KEY, language:'ko-KR', ...params });
  const r = await fetch(u);
  if (!r.ok) throw new Error(r.status === 401 ? 'TMDB 키가 올바르지 않아요' : 'TMDB 오류 ' + r.status);
  return r.json();
}
let T_GENRES = null;
async function tmdbGenres(){ if (!T_GENRES) T_GENRES = (await tmdb('/genre/movie/list')).genres; return T_GENRES; }
const provCache = {};
async function tmdbProviders(id){
  if (provCache[id]) return provCache[id];
  const kr = (await tmdb(`/movie/${id}/watch/providers`)).results?.KR || {};
  const uniq = a => [...new Map(a.map(p => [p.provider_id, p])).values()];
  return provCache[id] = { flat:uniq(kr.flatrate || []), other:uniq([...(kr.rent || []), ...(kr.buy || [])]) };
}
function discoverParams(){
  const p = { include_adult:'false' };
  if (S.tMode === 'top') Object.assign(p, { sort_by:'vote_average.desc', 'vote_count.gte':'1500' });
  if (S.tMode === 'popular') Object.assign(p, { sort_by:'popularity.desc', 'vote_count.gte':'200',
    'primary_release_date.gte':`${new Date().getFullYear() - 3}-01-01` });
  if (S.tMode === 'ott') Object.assign(p, { sort_by:'vote_average.desc', 'vote_count.gte':'500',
    watch_region:'KR', with_watch_monetization_types:'flatrate' });
  if (S.tGenre) p.with_genres = String(S.tGenre);
  return p;
}
const pageInfo = {};
async function tmdbRandomMovie(){
  const params = discoverParams(), key = JSON.stringify(params);
  if (!pageInfo[key]) pageInfo[key] = (await tmdb('/discover/movie', { ...params, page:'1' })).total_pages || 1;
  const seen = new Set(S.movies.map(m => normT(m.title)));
  const maxPage = Math.min(pageInfo[key], S.tMode === 'popular' ? 15 : 25);
  for (let tries = 0; tries < 4; tries++){
    const page = 1 + Math.floor(Math.random() * maxPage);
    const res = (await tmdb('/discover/movie', { ...params, page:String(page) })).results || [];
    const ok = res.filter(m => !seen.has(normT(m.title)) && !seen.has(normT(m.original_title)) && m.id !== S.pickResult?.tmdb?.id);
    if (ok.length) return ok[Math.floor(Math.random() * ok.length)];
  }
  return null;
}
async function tmdbFind(title){
  const y = String(title).match(/\((\d{4})\)/)?.[1];
  const d = await tmdb('/search/movie', { query:searchTitle(title), ...(y ? { year:y } : {}) });
  return d.results?.[0] || null;
}

function clubCandidates(){
  return S.movies.filter(mv => {
    const v = starVals(ratingsOf(mv.id));
    const a = mean(v);
    switch (S.pickFilter){
      case 'unseen': return !ratingsOf(mv.id).some(x => x.member_id === S.me && x.stars != null);
      case 'high': return a != null && a >= 4;
      case 'split': return v.length >= 2 && Math.max(...v) - Math.min(...v) >= 2;
      default: return true;
    }
  });
}
function newCandidates(){
  const seen = new Set(S.movies.map(m => normT(m.title)));
  return POOL.filter(p => !seen.has(normT(p[0])) && (S.pickGenre === '전체' || p[3] === S.pickGenre));
}

    note = `후보 ${clubCandidates().length}편 중에서 뽑아요`;
  } else if (live){
    chips = T_MODES.map(([k, l]) => `<button class="chip ${S.tMode === k ? 'on' : ''}" data-act="tmode" data-k="${k}">${l}</button>`).join('')

function movieOrder(a, b){
  const ra = S.rounds.find(r => r.id === a.round_id), rb = S.rounds.find(r => r.id === b.round_id);
  const key = (r, m) => [r?.year ?? 0, r?.period_type === 'quarter' ? 1 : 0, r?.period ?? 0, m.kind === 'group' ? 9 : -m.slot];
  const ka = key(ra, a), kb = key(rb, b);
  for (let i = 0; i < ka.length; i++) if (ka[i] !== kb[i]) return kb[i] - ka[i];

}

// ---------- 방구석 아카데미 ----------
const AC_CATS = ['작품상','감독상','각본상','촬영상','음악상','미술상','남우주연상','여우주연상','조연상'];
const AC_ICON = { 작품상:'🎬', 감독상:'🎥', 각본상:'✍️', 촬영상:'📷', 음악상:'🎵', 미술상:'🎨', 남우주연상:'🤵', 여우주연상:'👗', 조연상:'🌟' };
const acNorm = t => String(t || '').replace(/\(.*?\)/g, '').replace(/[\s:·.,!?~\-]/g, '').toLowerCase();
const acYears = () => [...new Set([new Date().getFullYear(), ...S.rounds.map(r => r.year), ...S.ballots.map(b => b.year)])].sort((a, b) => b - a);
const ballotOf = (y, m) => S.ballots.find(b => b.year === y && b.member_id === m);
const acRound = y => y >= 2020 ? `제 ${y - 2019}회` : '';
const shortName = n => n.length >= 3 ? n.slice(1) : n;      // 김선엽 → 선엽

// 부문 순서: 기본 부문 → 그 외
function acCats(items){
  const set = new Set(items.map(a => a.category));
  return [...AC_CATS.filter(c => set.has(c)), ...[...set].filter(c => !AC_CATS.includes(c))];
}
// 같은 작품/인물을 고른 사람끼리 묶기 (많이 겹친 순)
// 같은 작품/인물인지 판단하는 기준
//  · 인물 부문(감독·주연·조연, 괄호 있는 각본상): 괄호 앞 이름으로 비교 (한 글자 차이까지는 같은 사람으로 봄)
//  · 작품 부문: TMDB에서 찾은 영화가 같으면 같은 작품 (표기가 달라도 OK), 못 찾았으면 글자로 비교
const isPersonCat = (cat, pick) => /감독|주연|조연/.test(cat) || (/각본/.test(cat) && /\(.+\)/.test(pick));
function acIdent(y, cat, pick){
  if (isPersonCat(cat, pick)) return 'p:' + acNorm(pick);
  const t = pickTitle(cat, pick);
  const ov = posterOverride(y, t);
  const id = ov ? ov.tmdb_id : PCACHE[`${y}|${t}`]?.id;
  return id ? 'm:' + id : 't:' + acNorm(t);
}
function lev1(a, b){                       // 편집 거리 1 이하인지
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
const sameIdent = (k1, k2) => k1 === k2 || (k1.startsWith('p:') && k2.startsWith('p:') && Math.min(k1.length, k2.length) >= 5 && lev1(k1, k2));
// 같은 작품/인물을 고른 사람끼리 묶기 (많이 겹친 순)
function acGroups(y, cat, members){
  const groups = [];
  members.forEach(m => {
    const a = S.awards.find(x => x.year === y && x.member_id === m.id && x.category === cat);
    if (!a?.pick) return;
    const k = acIdent(y, cat, a.pick);
    let g = groups.find(x => sameIdent(x.key, k));
    if (!g){ g = { key:k, pick:a.pick, alts:[], who:[] }; groups.push(g); }
    else if (acNorm(a.pick) !== acNorm(g.pick) && !g.alts.includes(a.pick)) g.alts.push(a.pick);
    g.who.push(m);
  });
  return groups.sort((a, b) => b.who.length - a.who.length);
}

// ----- 포스터 (TMDB) -----
const AC_ALIAS = { '에에올':'에브리씽 에브리웨어 올 앳 원스' };
function pickTitle(cat, pick){
  const m = String(pick).match(/^(.*?)\s*\((.*)\)\s*$/);
  const main = (m ? m[1] : pick).trim();
  const paren = m ? m[2].split(/,\s+/).pop().trim() : '';   // '틱,틱..붐!'처럼 붙은 쉼표는 제목으로 둠
  const t = (/감독|주연|조연|각본/.test(cat) && paren) ? paren : main;
  return AC_ALIAS[t] || t;
}
let PCACHE = {}; try { PCACHE = JSON.parse(localStorage.getItem('mvclub_posters3') || '{}'); } catch(e){}
const PFAIL = new Set();   // 이번 접속에서 검색 실패한 것 (반복 요청 방지)
const pcSave = () => { try { localStorage.setItem('mvclub_posters3', JSON.stringify(PCACHE)); } catch(e){} };
const pposter = (cat, pick, cls = '', y = 0, editable = false) => useTMDB()
  ? `<div class="pp ${cls}${editable ? ' edit' : ''}" data-pq="${esc(pickTitle(cat, pick))}" data-py="${y}"${editable ? ' data-act="ppick" title="포스터 바꾸기"' : ''}><span>${AC_ICON[cat] || '🏆'}</span></div>` : '';
const posterOverride = (y, q) => (S.aposters || []).find(p => p.year === y && p.title === q);
const ryear = x => +(x.release_date || '0').slice(0, 4) || 0;
// 시상식 연도(한국 개봉 기준)에 가까운 작품을 고름 → 같은 제목이라도 구분
function bestForYear(res, q, y){
  const nq = normT(q);
  const exact = res.filter(x => normT(x.title) === nq || normT(x.original_title) === nq);
  const pool = exact.length ? exact : res.slice(0, 5);
  const dist = x => { const r = ryear(x); if (!r || !y) return 50; return r <= y ? y - r : (r - y) * 3; };
  return [...pool].sort((a, b) => dist(a) - dist(b) || (b.vote_count || 0) - (a.vote_count || 0))[0];
}
async function hydratePosters(){
  if (!useTMDB()) return;
  const els = [...document.querySelectorAll('.pp[data-pq]:not(.done)')];
  const fill = (el, path) => { el.classList.add('done'); el.innerHTML = path ? `<img src="${TMDB_IMG}w185${path}" alt="" loading="lazy">` : `<span>${el.textContent.trim() || '🎬'}</span>`; };
  const keyOf = el => `${el.dataset.py}|${el.dataset.pq}`;
  const todo = [];
  els.forEach(el => {
    const ov = posterOverride(+el.dataset.py, el.dataset.pq);
    if (ov) return fill(el, ov.poster);
    const k = keyOf(el);
    if (k in PCACHE) return fill(el, PCACHE[k]?.poster);
    if (!todo.includes(k) && !PFAIL.has(k)) todo.push(k);
  });
  // 화면에 포스터가 없는 수상작도 '같은 영화인지' 판단하려고 미리 찾아둠
  if (S.tab === 'academy'){
    const years = S.acView === 'hall' ? [...new Set(S.ballots.filter(b => b.is_public).map(b => b.year))] : [S.ayear];
    S.awards.filter(a => years.includes(a.year) && a.pick && !isPersonCat(a.category, a.pick)).forEach(a => {
      const t = pickTitle(a.category, a.pick), k = `${a.year}|${t}`;
      if (!posterOverride(a.year, t) && !(k in PCACHE) && !todo.includes(k) && !PFAIL.has(k)) todo.push(k);
    });
  }
  let found = 0;
  const worker = async () => {
    while (todo.length){
      const k = todo.shift(); const [y, ...rest] = k.split('|'); const q = rest.join('|');
      try {
        let res = [], used = q;
        for (const qq of [...new Set([q, q.replace(/[:·]/g, ' ').replace(/\s+/g, ' ').trim(), q.replace(/\s+/g, ''), q.split(':')[0].trim()])].filter(Boolean)){
          res = (await tmdb('/search/movie', { query:qq })).results || [];
          if (res.length){ used = qq; break; }
        }
        const hit = bestForYear(res, used, +y);
        PCACHE[k] = hit ? { id:hit.id, poster:hit.poster_path || null } : null;
        if (hit) found++;
      } catch(e){ PFAIL.add(k); continue; }
      document.querySelectorAll('.pp[data-pq]:not(.done)').forEach(el => { if (keyOf(el) === k) fill(el, PCACHE[k]?.poster); });
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  pcSave();
  // 새로 찾은 정보로 '같은 작품' 묶음이 바뀔 수 있으니 한 번 다시 그림
  if (found && S.tab === 'academy' && !document.querySelector('.cer') && !$('#modal').classList.contains('open')) renderAcademy();
}

        <span class="aw-who">${g.who.map(m => `<i>${esc(solo ? m.name : shortName(m.name))}</i>`).join('')}${crown && i === 0 ? ` <em>👑 ${g.who.length}명</em>` : ''}</span></div>

// 멤버끼리 같은 걸 고른 비율
function tasteHTML(){
  const pairs = [];
  for (let i = 0; i < S.members.length; i++) for (let j = i + 1; j < S.members.length; j++){
    const a = S.members[i], b = S.members[j]; let same = 0, n = 0;
    S.awards.filter(x => x.member_id === a.id && x.pick && ballotOf(x.year, a.id)?.is_public).forEach(x => {
      const o = S.awards.find(z => z.member_id === b.id && z.year === x.year && z.category === x.category && z.pick && ballotOf(z.year, b.id)?.is_public);
      if (o){ n++; if (sameIdent(acIdent(x.year, x.category, x.pick), acIdent(o.year, o.category, o.pick))) same++; }
    });
    if (n) pairs.push({ a, b, same, n, r:same / n });
  }
  if (!pairs.length) return '';
  pairs.sort((x, y) => y.r - x.r);
  return `<div class="panel"><h3>💞 취향 일치도</h3><p class="d">같은 해·같은 부문에서 똑같이 고른 비율</p>
    ${pairs.map(p => `<div class="bar-row"><span class="bl">${esc(p.a.name)} · ${esc(p.b.name)}</span>
      <span class="bt"><span style="width:${p.r * 100}%"></span></span><span class="bv">${Math.round(p.r * 100)}%</span></div>`).join('')}</div>`;
}

// ----- 시상식 진행 모드 -----
function openCeremony(){
  const y = S.ayear;
  const pub = S.members.filter(m => ballotOf(y, m.id)?.is_public);
  const order = acCats(S.awards.filter(a => a.year === y && pub.some(m => m.id === a.member_id)));
  if (!order.length) return;
  const cats = [...order].reverse();   // 발표는 조연상 → … → 작품상 (가장 큰 상을 마지막에)
  let i = -1, opened = false;
  const ov = document.createElement('div'); ov.className = 'cer';
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); };
  const draw = () => {
    let inner;
    if (i < 0) inner = `<div class="cer-kicker">${acRound(y)}</div><div class="cer-title">방구석 아카데미<br><span>${y}</span></div>
        <div class="cer-sub">${pub.map(m => esc(m.name)).join(' · ')}</div>
        <button class="btn primary cer-btn" data-c="next">시상식 시작 →</button>
        <div><button class="cer-skip" data-c="all">결과 한 번에 보기</button></div>`;
    else if (i >= cats.length) inner = `<div class="cer-kicker">${acRound(y)}</div><div class="cer-title sm">🏆 ${y} 방구석 아카데미<br><span>전체 수상 결과</span></div>
        <div class="cer-sum">${order.map((c, n) => { const groups = acGroups(y, c, pub);
          return `<div class="cer-sc" style="animation-delay:${n * 0.06}s"><div class="cer-sc-h">${AC_ICON[c] || '🏆'} ${esc(c)}</div>
            ${groups.map((g, k) => `<div class="cer-sr ${k === 0 && g.who.length >= 2 ? 'win' : ''}">${pposter(c, g.pick, 'cersp', y)}
              <div><b>${esc(g.pick)}${k === 0 && g.who.length >= 2 ? ' 👑' : ''}</b><span>${g.who.map(m => esc(m.name)).join(' · ')}</span></div></div>`).join('')}</div>`; }).join('')}</div>
        <div class="cer-sub">수고하셨습니다 👏</div>
        <button class="btn primary cer-btn" data-c="close">닫기</button>`;
    else {
      const c = cats[i], groups = acGroups(y, c, pub);
      inner = `<div class="cer-kicker">${i + 1} / ${cats.length}</div>
        <div class="cer-cat">${AC_ICON[c] || '🏆'} ${esc(c)}</div>
        ${opened ? `<div class="cer-picks">${groups.map((g, k) => `<div class="cer-pick ${k === 0 && g.who.length >= 2 ? 'win' : ''}" style="animation-delay:${k * 0.25}s">
              ${pposter(c, g.pick, 'cerpp', y)}<div><b>${esc(g.pick)}</b><span>${g.who.map(m => esc(m.name)).join(' · ')}${k === 0 && g.who.length >= 2 ? ' 👑' : ''}</span></div></div>`).join('')}</div>
            <button class="btn primary cer-btn" data-c="next">${i === cats.length - 1 ? '마치기' : '다음 부문 →'}</button>`
          : `<div class="cer-env" data-c="open">✉️<small>눌러서 공개</small></div>
            <div class="cer-sub">The winner is…</div>`}`;
    }
    ov.innerHTML = `<button class="cer-x" data-c="close" aria-label="닫기">✕</button><div class="cer-in ${i >= cats.length ? 'wide' : ''}">${inner}</div>`;
    ov.scrollTop = 0;
    hydratePosters();
  };
  ov.onclick = e => {
    const c = e.target.closest('[data-c]')?.dataset.c;
    if (c === 'close') close();
    else if (c === 'open'){ opened = true; draw(); }
    else if (c === 'all'){ i = cats.length; draw(); }
    else if (c === 'next'){ i++; opened = false; draw(); }
  };
  const key = e => {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if (i >= 0 && i < cats.length && !opened){ opened = true; } else if (i < cats.length){ i++; opened = false; } else return close(); draw(); }
  };
  document.addEventListener('keydown', key);
  draw();
}

// ================= 방구석 여행가 =================
const TV_KINDS = ['숙소', '맛집', '카페', '관광', '쇼핑', '기타'];
const TV_ICON = { 숙소:'🏨', 맛집:'🍜', 카페:'☕', 관광:'📸', 쇼핑:'🛍', 기타:'📌' };
const won = n => (Math.round(n) || 0).toLocaleString('ko-KR') + '원';
const todayStr = () => { const t = new Date(); return new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const dDiff = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDay = d => { const x = new Date(d + 'T00:00:00'); return `${x.getMonth() + 1}.${x.getDate()} (${WEEK[x.getDay()]})`; };
const fmtRange = t => !t.start_date ? '날짜 미정'
  : t.end_date && t.end_date !== t.start_date ? `${t.start_date.replaceAll('-', '.')} – ${t.end_date.slice(5).replace('-', '.')}` : t.start_date.replaceAll('-', '.');
const mapLink = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
function tripStatus(t){
  const today = todayStr();
  if (!t.start_date) return { k:'plan', label:'날짜 미정' };
  const end = t.end_date || t.start_date;
  if (t.start_date > today) return { k:'soon', label:`D-${dDiff(t.start_date, today)}` };
  if (end >= today) return { k:'now', label:'여행 중 ✈️' };
  return { k:'done', label:'다녀옴' };
}
const nights = t => t.start_date && t.end_date ? dDiff(t.end_date, t.start_date) : null;
const tripMembers = t => S.members.filter(m => (t.member_ids?.length ? t.member_ids : S.members.map(x => x.id)).includes(m.id));
const wishVotes = id => (S.wishVotes || []).filter(v => v.wish_id === id);
function hueOf(s){ let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function coverStyle(t){
  if (t.cover_url) return `background-image:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.65)),url('${encodeURI(t.cover_url)}')`;
  const h = hueOf(t.place || t.title);
  return `background-image:linear-gradient(135deg,hsl(${h} 55% 42%),hsl(${(h + 40) % 360} 60% 26%))`;
}

async function loadTravel(){
  const res = await Promise.all([
    sb.from('tv_trips').select('*'), sb.from('tv_plans').select('*'), sb.from('tv_expenses').select('*'),

  ]);
  const st = await sb.from('tv_settles').select('*');
  S.settles = st.error ? [] : st.data;
  const ua = await sb.from('tv_avail').select('*');

}

// 정산
const POOL_ACC = { id:null, name:'🏦 모임통장' };
const FUND_LABEL = { split:'개인 결제 · 1/n', pool:'모임통장으로 결제', reimburse:'개인 결제 → 통장에서 돌려받기' };
function settle(t){
  const mem = tripMembers(t);
  const exps = S.expenses.filter(e => e.trip_id === t.id);
  const paid = {}, owe = {}, poolOwes = {};
  let poolPaid = 0;
  S.members.forEach(m => { paid[m.id] = 0; owe[m.id] = 0; poolOwes[m.id] = 0; });
  exps.forEach(e => {
    const amt = Number(e.amount), fund = e.fund || 'split';
    if (fund === 'pool'){ poolPaid += amt; return; }
    if (fund === 'reimburse'){ poolOwes[e.paid_by] = (poolOwes[e.paid_by] || 0) + amt; return; }
    const split = e.split_ids?.length ? e.split_ids : mem.map(m => m.id);
    paid[e.paid_by] = (paid[e.paid_by] || 0) + amt;
    split.forEach(id => { owe[id] = (owe[id] || 0) + amt / split.length; });
  });
  const done = (S.settles || []).filter(x => x.trip_id === t.id).sort((a, b) => a.id - b.id);
  // 개인 간 송금 반영
  const sent = {};
  done.filter(x => x.from_id != null).forEach(x => { sent[x.from_id] = (sent[x.from_id] || 0) + Number(x.amount); sent[x.to_id] = (sent[x.to_id] || 0) - Number(x.amount); });
  // 통장 → 개인 송금 반영
  const poolSent = {};
  done.filter(x => x.from_id == null).forEach(x => { poolSent[x.to_id] = (poolSent[x.to_id] || 0) + Number(x.amount); });
  const people = S.members.filter(m => mem.includes(m) || paid[m.id] || owe[m.id] || sent[m.id] || poolOwes[m.id]);
  const bal = people.map(m => ({ m, paid:paid[m.id], owe:owe[m.id], sent:sent[m.id] || 0, poolOwe:poolOwes[m.id] || 0, poolGot:poolSent[m.id] || 0,
    diff:paid[m.id] + (sent[m.id] || 0) - owe[m.id] }));
  const transfers = [];
  // 1) 통장에서 돌려줄 돈
  bal.forEach(b => { const left = Math.round(b.poolOwe - b.poolGot); if (left > 0) transfers.push({ from:POOL_ACC, to:b.m, amount:left, pool:true }); });
  // 2) 개인 간 1/n
  const cred = bal.filter(b => b.diff > 0.5).map(b => ({ ...b, left:b.diff })).sort((a, b) => b.left - a.left);
  const debt = bal.filter(b => b.diff < -0.5).map(b => ({ ...b, left:-b.diff })).sort((a, b) => b.left - a.left);
  let i = 0, j = 0;
  while (i < debt.length && j < cred.length){
    const x = Math.min(debt[i].left, cred[j].left);
    if (Math.round(x) > 0) transfers.push({ from:debt[i].m, to:cred[j].m, amount:Math.round(x) });
    debt[i].left -= x; cred[j].left -= x;
    if (debt[i].left < 0.5) i++;
    if (cred[j].left < 0.5) j++;
  }
  const total = exps.reduce((s, e) => s + Number(e.amount), 0);
  const poolTotal = poolPaid + exps.filter(e => e.fund === 'reimburse').reduce((s, e) => s + Number(e.amount), 0);
  return { exps, bal, transfers, done, total, poolTotal, poolPaid };
}

const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const TRIP_COLORS = ['#7cc4a8', '#f2b33d', '#ee7a45', '#9fc3ff', '#d68bd6', '#e8b93e', '#6fd0d6'];
const tripColor = t => TRIP_COLORS[t.id % TRIP_COLORS.length];
const availOn = day => (S.avail || []).filter(u => u.day === day).map(u => u.member_id);
function renderCal(){

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);

  while (cells.length % 7) cells.push(null);
  const today = todayStr();

  const n = S.members.length;
  const trips = (S.trips || []).filter(t => t.start_date);
  const tripsOn = day => trips.filter(t => day >= t.start_date && day <= (t.end_date || t.start_date));
  const calEv = corEvents(true).filter(e => e.cat !== 'travel' && !e.soft);

  const cellHTML = d => {
    if (!d) return '<div class="cal-c empty"></div>';
    const day = ymd(d), dow = d.getDay(), past = day < today;
    const cls = ['cal-c', dow === 0 ? 'sun' : dow === 6 ? 'sat' : '', day === today ? 'today' : '', past ? 'past' : ''];
    if (avail){
      const yes = availOn(day), mine = yes.includes(S.me), ok = yes.length;
      cls.push(mine ? 'mine-yes' : '', !past && ok === n ? 'all-ok' : '');
      return `<button class="${cls.join(' ')}" ${past ? 'disabled' : `data-act="calDay" data-k="${day}"`}>
        <span class="cal-d">${d.getDate()}</span>
        ${past ? '' : `${ok ? `<span class="cal-ok">${ok === n ? '✓ 모두' : `${ok}/${n}`}</span>` : ''}
        <span class="cal-no">${yes.map(id => `<i title="${esc(memName(id))} 가능">${esc(memName(id).slice(-2, -1) || memName(id)[0])}</i>`).join('')}</span>`}
        ${tripsOn(day).map(t => `<span class="cal-tdot" style="background:${tripColor(t)}"></span>`).join('')}

    const others = calEv.filter(e => e.date === day);
    return `<div class="${cls.join(' ')}"><span class="cal-d">${d.getDate()}</span>
      ${ts.map(t => { const st = day === t.start_date || dow === 0, en = day === (t.end_date || t.start_date) || dow === 6;
        return `<button class="cal-bar ${st ? 'st' : ''} ${en ? 'en' : ''}" style="--c:${tripColor(t)}" data-act="tvOpenCal" data-id="${t.id}" title="${esc(t.title)}">${st ? esc(t.title) : '&nbsp;'}</button>`; }).join('')}
      ${others.map(e => `<button class="cal-ev cev-${e.cat}" data-act="${e.act}" data-id="${e.id ?? ''}" title="${esc(e.title)}">${e.icon} ${esc(e.title.replace('단체관람 · ', '').replace('게임 날 · ', ''))}</button>`).join('')}</div>`;
  };

  // 이번 달 4명 다 되는 주말 / 연속 날짜
  const weekendOk = [], nearOk = [];
  if (avail) for (let d = 1; d <= daysIn; d++){

    else if (okA) weekendOk.push(`${M + 1}/${d}(토) 당일`);
    else if (n > 1){ const c = Math.max(availOn(da).length, availOn(db).length); if (c === n - 1) nearOk.push(`${M + 1}/${d}~${b.getDate()} 주말 · ${c}명`); }
  }
  const monthTrips = trips.filter(t => t.start_date <= ymd(new Date(Y, M, daysIn)) && (t.end_date || t.start_date) >= ymd(first)).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const myCount = (S.avail || []).filter(u => u.member_id === S.me && u.day >= ymd(first) && u.day <= ymd(new Date(Y, M, daysIn))).length;

  $('#main').innerHTML = `
    <div class="viewbar" style="margin-top:18px"><div class="seg">
      <button class="${!avail ? 'on' : ''}" data-act="calMode" data-k="trips">📅 COR 달력</button>

function poolLedger(){
  const rows = [];
  (S.poolTx || []).forEach(x => rows.push({ date:x.tx_date, amt:x.kind === 'in' ? +x.amount : -x.amount, kind:x.kind,
    title:x.memo || (x.kind === 'in' ? '입금' : '출금'), who:x.member_id, id:x.id, src:'tx', by:x.created_by }));
  (S.expenses || []).filter(e => e.fund === 'pool').forEach(e => { const t = S.trips.find(z => z.id === e.trip_id);
    rows.push({ date:e.spent_on || t?.start_date || '', amt:-Number(e.amount), kind:'trip', title:e.title, trip:t, src:'exp' }); });
  (S.settles || []).filter(x => x.from_id == null).forEach(x => { const t = S.trips.find(z => z.id === x.trip_id);
    rows.push({ date:(x.created_at || '').slice(0, 10), amt:-Number(x.amount), kind:'reimb', title:`${memName(x.to_id)}에게 돌려줌`, trip:t, src:'settle' }); });
  rows.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  let run = 0; rows.forEach(r => { run += r.amt; r.bal = run; });
  return rows.reverse();
}
const poolBalance = () => poolLedger()[0]?.bal ?? 0;
function poolPending(){
  // 아직 통장에서 안 돌려준 돈 (모든 여행)
  return (S.trips || []).flatMap(t => settle(t).transfers.filter(x => x.pool).map(x => ({ ...x, trip:t })));
}

function reviewHTML(t){

    if (!g){ g = { k, kind:r.kind, name:r.name, items:[] }; groups.push(g); }

  groups.forEach(g => { const v = g.items.map(r => r.stars).filter(x => x != null).map(Number); g.avg = mean(v); });
  groups.sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1));
  const kinds = ['전체', ...TV_KINDS.filter(k => all.some(r => r.kind === k))];
  return `<div class="toolbar"><div class="chips">${kinds.map(k => `<button class="chip ${S.rvKind === k ? 'on' : ''}" data-act="rvKind" data-k="${k}">${k === '전체' ? '전체' : TV_ICON[k] + ' ' + k}</button>`).join('')}</div>

// ---------- 올해의 작품 (올해의 영화 / 올해의 테마) ----------
async function loadBest(){
  const res = await Promise.all([sb.from('mv_best_ballots').select('*'), sb.from('mv_best_votes').select('*')]);
  const bad = res.find(x => x.error);
  if (bad){ S.bestErr = bad.error.message; S.bBallots = []; S.bVotes = []; return; }
  S.bestErr = null; [S.bBallots, S.bVotes] = res.map(x => x.data);
}
const bBallot = (y, m) => (S.bBallots || []).find(b => b.year === y && b.member_id === m);
const roundOfMovie = mv => S.rounds.find(r => r.id === mv.round_id);
const moviesOfYear = y => S.movies.filter(mv => roundOfMovie(mv)?.year === y).sort(movieOrder).reverse();
const themesOfYear = y => S.rounds.filter(r => r.year === y && r.period_type === 'quarter' && r.theme).sort((a, b) => a.period - b.period);
const movieLabel = mv => { const r = roundOfMovie(mv); return `${r ? periodLabel(r) + ' · ' : ''}${mv.title}${mv.kind === 'group' ? ' (단체관람)' : ''}`; };
const posterImg = (mv, cls = '') => `<div class="bp ${cls}">${mv?.tmdb?.poster ? `<img src="${TMDB_IMG}w342${mv.tmdb.poster}" alt="">` : '<span>🎬</span>'}</div>`;
const avgOfMovie = id => mean(starVals(ratingsOf(id)));
function themeAvg(r){
  const v = S.movies.filter(m => m.round_id === r.id && m.kind === 'pick').flatMap(m => starVals(ratingsOf(m.id)));
  return { avg:mean(v), n:v.length };
}
// 그해 한줄평 목록 (멤버 한줄평 + 작성자 미상 예전 한줄평)
function commentsOfYear(y){
  const out = [];
  moviesOfYear(y).slice().reverse().forEach(m => {
    S.ratings.filter(r => r.movie_id === m.id && r.comment).forEach(r => out.push({ ref:'r:' + r.id, m, who:r.member_id, text:r.comment }));
    S.legacy.filter(l => l.movie_id === m.id).forEach(l => out.push({ ref:'l:' + l.id, m, who:null, text:l.body }));
  });
  return out;
}
function commentByRef(ref){
  if (!ref) return null;
  const t = ref.slice(0, 1), n = +ref.slice(2);
  if (t === 'r'){ const r = S.ratings.find(x => x.id === n); const m = r && S.movies.find(x => x.id === r.movie_id); return r && m ? { ref, m, who:r.member_id, text:r.comment || '(삭제된 한줄평)' } : null; }
  const l = S.legacy.find(x => x.id === n); const m = l && S.movies.find(x => x.id === l.movie_id);
  return l && m ? { ref, m, who:null, text:l.body } : null;
}
const whoName = c => c.who ? memName(c.who) : '작성자 미상';

function bestTally(y, cat){
  const pub = S.members.filter(m => bBallot(y, m.id)?.is_public);
  const map = new Map();
  (S.bVotes || []).filter(v => v.year === y && v.category === cat && pub.some(m => m.id === v.member_id)).forEach(v => {
    const k = cat === 'movie' ? v.movie_id : cat === 'theme' ? v.round_id : v.ref;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push({ m:S.members.find(x => x.id === v.member_id), comment:v.comment });
  });
  return [...map.entries()].map(([id, voters]) => ({ id, voters }))
    .sort((a, b) => b.voters.length - a.voters.length || (cat === 'comment' ? 0 : ((cat === 'movie' ? avgOfMovie(b.id) : themeAvg(S.rounds.find(r => r.id === b.id) || {}).avg) ?? 0) - ((cat === 'movie' ? avgOfMovie(a.id) : themeAvg(S.rounds.find(r => r.id === a.id) || {}).avg) ?? 0)));
}

function bestResultHTML(y, pub){
  if (!pub.length) return `<div class="panel ac-locked">🔒<br>아직 아무도 공개하지 않았어요<br><small>각자 공개하면 결과가 나타나요</small></div>`;

  const movieWin = top(mv).map(x => { const m = S.movies.find(z => z.id === x.id); if (!m) return ''; const a = avgOfMovie(m.id);
    return `<div class="b-win">${posterImg(m, 'lg')}<div class="b-txt"><div class="b-meta">${esc(movieLabel(m).split(' · ')[0])}${a != null ? ` · ★ ${a.toFixed(1)}` : ''}</div>
      <div class="b-title">${esc(m.title)}</div>${voterLine(x.voters)}</div></div>`; }).join('');
  const themeWin = top(th).map(x => { const r = S.rounds.find(z => z.id === x.id); if (!r) return ''; const ms = S.movies.filter(m => m.round_id === r.id && m.kind === 'pick').sort((a, b) => a.slot - b.slot); const ta = themeAvg(r);
    return `<div class="b-win col"><div class="b-posters">${ms.map(m => posterImg(m)).join('')}</div><div class="b-txt"><div class="b-meta">${periodLabel(r)}${r.recommender_id ? ` · ${esc(memName(r.recommender_id))} 추천` : ''}${ta.avg != null ? ` · 평균 ★ ${ta.avg.toFixed(1)}` : ''}</div>
      <div class="b-title">${esc(r.theme)}</div>${voterLine(x.voters)}</div></div>`; }).join('');
  const comWin = top(cm).map(x => { const c = commentByRef(x.id); if (!c) return '';

  const rest = (arr, cat) => arr.slice(top(arr).length).map(x => {

function openBestShow(){
  const y = S.byear;
  const steps = [];
  if (commentsOfYear(y).length) steps.push(['comment', '✍️ 올해의 한줄평']);
  if (themesOfYear(y).length) steps.push(['theme', '🎨 올해의 테마']);
  steps.push(['movie', '🎬 올해의 영화']);
  let i = -1, opened = false;
  const ov = document.createElement('div'); ov.className = 'cer best-cer'; document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); };
  const winnerHTML = cat => {
    const t = bestTally(y, cat); const n = t[0]?.voters.length || 0;
    const tops = t.filter(x => x.voters.length === n);
    if (!tops.length) return '<div class="cer-sub">아직 표가 없어요</div>';
    return tops.map((x, k) => {
      if (cat === 'movie'){ const m = S.movies.find(z => z.id === x.id);
        return `<div class="cer-pick win" style="animation-delay:${k * .25}s">${posterImg(m, 'cer2')}<div><b>${esc(m.title)}</b><span>${x.voters.length}표 · ${x.voters.map(v => esc(v.m.name)).join(' · ')}</span></div></div>`; }
      if (cat === 'comment'){ const c = commentByRef(x.id); if (!c) return '';
        return `<div class="cer-pick win" style="animation-delay:${k * .25}s">${posterImg(c.m, 'cer2')}<div><b class="cer-quote">“${esc(c.text)}”</b><span>— ${esc(whoName(c))} · ${esc(c.m.title)} · ${x.voters.length}표</span></div></div>`; }
      const r = S.rounds.find(z => z.id === x.id);
      return `<div class="cer-pick win" style="animation-delay:${k * .25}s"><div><b>${esc(r.theme)}</b><span>${periodLabel(r)} · ${r.recommender_id ? esc(memName(r.recommender_id)) + ' 추천 · ' : ''}${x.voters.length}표</span></div></div>`;
    }).join('');
  };
  const draw = () => {
    let inner;
    if (i < 0) inner = `<div class="cer-kicker" style="color:#9fc3ff">BEST OF THE YEAR</div><div class="cer-title">올해의 작품<br><span style="color:#9fc3ff">${y}</span></div><button class="btn primary cer-btn" data-c="next">발표 시작 →</button>`;
    else if (i >= steps.length) inner = `<div class="cer-trophy">🏅</div><div class="cer-title">축하합니다!</div><button class="btn primary cer-btn" data-c="close">닫기</button>`;
    else inner = `<div class="cer-kicker">${i + 1} / ${steps.length}</div><div class="cer-cat">${steps[i][1]}</div>
      ${opened ? `<div class="cer-picks">${winnerHTML(steps[i][0])}</div><button class="btn primary cer-btn" data-c="next">${i === steps.length - 1 ? '마치기' : '다음 →'}</button>`
        : `<div class="cer-env" data-c="open">✉️<small>눌러서 공개</small></div>`}`;
    ov.innerHTML = `<button class="cer-x" data-c="close" aria-label="닫기">✕</button><div class="cer-in">${inner}</div>`;
  };
  ov.onclick = e => { const c = e.target.closest('[data-c]')?.dataset.c; if (c === 'close') close(); else if (c === 'open'){ opened = true; draw(); } else if (c === 'next'){ i++; opened = false; draw(); } };
  const key = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  draw();
}

function guessRegion(text){
  const t = (text || '').trim();
  if (!t) return '';
  for (const [k, v] of Object.entries(REGION_FULL)) if (t.includes(k)) return v;
  for (const r of FD_REGIONS) if (t.startsWith(r) || new RegExp(`(^|\\s|,)${r}(특별|광역|시|$|\\s|,)`).test(t)) return r;
  for (const [r, ws] of Object.entries(REGION_HINT)) if (ws.some(w => t.includes(w))) return r;
  return '';
}

function placeStats(p){

    scores:Object.fromEntries(FD_SCORES.map(([k]) => [k, avg(k)])),
    revisit:FD_REVISIT.map(([v]) => rv.filter(r => r.revisit === v).length),
    revisitRate:rv.length ? rv.filter(r => r.revisit === 2).length / rv.length : null,
    menus:[...new Set(rs.flatMap(r => (r.best_menu || '').split(/[,、]/).map(x => x.trim()).filter(Boolean)))],
    visits:(S.visits || []).filter(v => v.place_id === p.id).length,
  };
}
